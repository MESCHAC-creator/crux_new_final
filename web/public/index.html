<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CRUX — Rejoindre une réunion</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Poppins', sans-serif;
      background: #0A0A14;
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: #12121E;
      border-radius: 20px;
      padding: 40px 32px;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 8px 40px rgba(0,0,0,0.5);
    }
    .logo {
      width: 64px; height: 64px;
      border-radius: 18px;
      background: linear-gradient(135deg, #B71C1C, #6A1B9A);
      display: flex; align-items: center; justify-content: center;
      font-size: 28px;
      margin: 0 auto 20px;
    }
    h1 { font-size: 24px; font-weight: 700; text-align: center; margin-bottom: 6px; }
    .sub { color: rgba(255,255,255,0.45); font-size: 14px; text-align: center; margin-bottom: 32px; }
    label { display: block; font-size: 13px; color: rgba(255,255,255,0.6); margin-bottom: 8px; }
    input[type="text"] {
      width: 100%;
      background: rgba(255,255,255,0.06);
      border: 1.5px solid rgba(255,255,255,0.1);
      border-radius: 12px;
      padding: 14px 16px;
      font-family: 'Poppins', sans-serif;
      font-size: 16px;
      color: #fff;
      letter-spacing: 2px;
      text-transform: uppercase;
      outline: none;
      transition: border-color .2s;
    }
    input[type="text"]:focus { border-color: #E74C3C; }
    input[type="text"]::placeholder { letter-spacing: 0; text-transform: none; color: rgba(255,255,255,0.3); }
    .btn {
      display: block;
      width: 100%;
      margin-top: 20px;
      padding: 15px;
      background: #E74C3C;
      border: none;
      border-radius: 12px;
      color: #fff;
      font-family: 'Poppins', sans-serif;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity .2s;
    }
    .btn:hover { opacity: 0.88; }
    .divider { display: flex; align-items: center; gap: 12px; margin: 24px 0; color: rgba(255,255,255,0.2); font-size: 13px; }
    .divider::before, .divider::after { content:''; flex:1; height:1px; background:rgba(255,255,255,0.1); }
    .app-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 14px;
      border: 1.5px solid rgba(255,255,255,0.15);
      border-radius: 12px;
      background: transparent;
      color: rgba(255,255,255,0.7);
      font-family: 'Poppins', sans-serif;
      font-size: 14px;
      cursor: pointer;
      text-decoration: none;
      transition: border-color .2s;
    }
    .app-btn:hover { border-color: rgba(255,255,255,0.35); }
    .error { color: #E74C3C; font-size: 13px; margin-top: 10px; display: none; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">📹</div>
    <h1>CRUX</h1>
    <p class="sub">Rejoindre une réunion depuis votre navigateur</p>

    <label for="codeInput">Code de réunion</label>
    <input type="text" id="codeInput" placeholder="Ex: ABC123DEF456" maxlength="20"
           oninput="this.value=this.value.toUpperCase()" />
    <p class="error" id="errMsg">Code invalide. Vérifiez et réessayez.</p>
    <button class="btn" onclick="joinByCode()">Rejoindre →</button>

    <div class="divider">ou</div>

    <a class="app-btn" href="https://play.google.com/store/apps/details?id=com.example.crux" target="_blank">
      📱 Télécharger l'application CRUX
    </a>
  </div>

  <script>
    // Check if URL has a code param already
    const params = new URLSearchParams(location.search);
    const code = params.get('code') || params.get('id');
    if (code) {
      document.getElementById('codeInput').value = code.toUpperCase();
    }

    function joinByCode() {
      const code = document.getElementById('codeInput').value.trim().toUpperCase();
      const err = document.getElementById('errMsg');
      if (code.length < 6) {
        err.style.display = 'block';
        return;
      }
      err.style.display = 'none';
      window.location.href = '/join/' + encodeURIComponent(code);
    }

    document.getElementById('codeInput').addEventListener('keydown', e => {
      if (e.key === 'Enter') joinByCode();
    });
  </script>
</body>
</html>
