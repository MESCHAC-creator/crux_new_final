workflows:

  # ═══════════════════════════════════════════════════════
  #  ANDROID RELEASE
  # ═══════════════════════════════════════════════════════
  android-release:
    name: Android Release - CRUX
    instance_type: linux
    max_build_duration: 120

    environment:
      flutter: 3.24.5
      java: 17
      groups:
        - firebase_deploy   # contient FIREBASE_TOKEN (optionnel)

    scripts:
      - name: Set up local.properties
        script: |
          FLUTTER_SDK=$(which flutter | xargs readlink -f | sed 's|/bin/flutter||')
          echo "flutter.sdk=$FLUTTER_SDK" > android/local.properties
          flutter --version

      - name: Get Flutter packages
        script: flutter pub get

      - name: Pre-install NDK + configure AGP + patch afterEvaluate
        script: |
          set -e
          FLUTTER_SDK=$(which flutter | xargs readlink -f | sed 's|/bin/flutter||')
          PUB_CACHE="${PUB_CACHE:-$HOME/.pub-cache}"

          # 1. Lock AGP 8.1.4 and Gradle 8.4 (no afterEvaluate restriction from AGP side)
          sed -i 's/id("com.android.application") version "[^"]*"/id("com.android.application") version "8.1.4"/' android/settings.gradle.kts
          sed -i 's/id("com.android.library") version "[^"]*"/id("com.android.library") version "8.1.4"/' android/settings.gradle.kts
          sed -i 's|gradle-[0-9.]*-bin.zip|gradle-8.4-bin.zip|' android/gradle/wrapper/gradle-wrapper.properties
          grep -q "^android.newDsl=false" android/gradle.properties || echo "android.newDsl=false" >> android/gradle.properties
          echo "✅ AGP 8.1.4 + Gradle 8.4"

          # 2. Pre-install NDK that Agora needs — avoids mid-evaluation download that
          #    corrupts Gradle project state and causes afterEvaluate to fire too late
          echo "y" | sdkmanager --install "ndk;25.1.8937393" 2>/dev/null || true
          echo "y" | sdkmanager --install "ndk;25.2.9519653" 2>/dev/null || true
          echo "✅ NDK pre-installed"

          # 3. Patch Flutter tools Kotlin source — guard every project.afterEvaluate {} call
          cat > /tmp/patch_flutter.py << 'PYEOF'
          import re, sys, glob, os
          flutter_sdk = sys.argv[1]
          gradle_src = os.path.join(flutter_sdk, "packages/flutter_tools/gradle/src/main/kotlin")

          def patch_file(filepath):
              with open(filepath) as f:
                  content = f.read()
              pattern = re.compile(r"(\b\w+)\.afterEvaluate \{")
              if not pattern.search(content):
                  return False
              result = []
              i = 0
              while i < len(content):
                  m = pattern.search(content, i)
                  if not m:
                      result.append(content[i:])
                      break
                  result.append(content[i:m.start()])
                  varname = m.group(1)
                  depth = 1
                  j = m.end()
                  while j < len(content) and depth > 0:
                      c = content[j]
                      if c == "{": depth += 1
                      elif c == "}": depth -= 1
                      j += 1
                  body = content[m.end():j-1]
                  replacement = "if (" + varname + ".state.executed) {\n" + body + "\n} else {\n" + varname + ".afterEvaluate {\n" + body + "\n}\n}"
                  result.append(replacement)
                  i = j
              new_content = "".join(result)
              if new_content != content:
                  with open(filepath, "w") as f:
                      f.write(new_content)
                  print("PATCHED KT: " + os.path.basename(filepath))
                  return True
              return False

          patched = 0
          for f in sorted(glob.glob(gradle_src + "/**/*.kt", recursive=True)):
              if "/test/" not in f and patch_file(f):
                  patched += 1
          print("Kotlin files patched: " + str(patched))
          PYEOF
          python3 /tmp/patch_flutter.py "$FLUTTER_SDK"

          # 4. Patch afterEvaluate in ALL plugin .gradle files in pub cache
          #    (covers agora_rtc_engine and any other plugin that calls afterEvaluate)
          cat > /tmp/patch_gradle.py << 'PYEOF'
          import re, sys, glob, os
          pub_cache = sys.argv[1]

          def patch_file(filepath):
              with open(filepath, encoding='utf-8', errors='ignore') as f:
                  content = f.read()
              # Match bare "afterEvaluate {" (Groovy style, no variable prefix)
              pattern = re.compile(r'(?<!\w)afterEvaluate\s*\{')
              if not pattern.search(content):
                  return False
              result = []
              i = 0
              while i < len(content):
                  m = pattern.search(content, i)
                  if not m:
                      result.append(content[i:])
                      break
                  result.append(content[i:m.start()])
                  depth = 1
                  j = m.end()
                  while j < len(content) and depth > 0:
                      if content[j] == '{': depth += 1
                      elif content[j] == '}': depth -= 1
                      j += 1
                  body = content[m.end():j-1]
                  replacement = "if (project.state.executed) {" + body + "\n} else {\nafterEvaluate {" + body + "\n}\n}"
                  result.append(replacement)
                  i = j
              new_content = "".join(result)
              if new_content != content:
                  with open(filepath, 'w', encoding='utf-8') as f:
                      f.write(new_content)
                  print("PATCHED GRADLE: " + os.path.relpath(filepath, pub_cache))
                  return True
              return False

          patched = 0
          for ext in ('*.gradle', '*.gradle.kts'):
              for f in glob.glob(pub_cache + "/**/" + ext, recursive=True):
                  if '/test/' not in f and patch_file(f):
                      patched += 1
          print("Gradle files patched: " + str(patched))
          PYEOF
          python3 /tmp/patch_gradle.py "$PUB_CACHE"
          echo "✅ All afterEvaluate calls patched"

          # 5. Force recompilation: clear Flutter tools compiled artifacts AND Gradle build cache
          rm -rf "$FLUTTER_SDK/packages/flutter_tools/gradle/build/" 2>/dev/null || true
          rm -rf "$FLUTTER_SDK/packages/flutter_tools/gradle/.gradle/" 2>/dev/null || true
          # Clear Gradle file-hash / build-cache so patched source is recompiled fresh
          rm -rf "$HOME/.gradle/caches/build-cache-"* 2>/dev/null || true
          rm -rf "$HOME/.gradle/caches/"*/executionHistory 2>/dev/null || true
          echo "✅ Gradle caches cleared"

      - name: Deploy Firestore rules (if FIREBASE_TOKEN is set)
        script: |
          if [ -n "$FIREBASE_TOKEN" ]; then
            npm install -g firebase-tools --silent
            firebase deploy --only firestore:rules \
              --project crux-8aa85 \
              --token "$FIREBASE_TOKEN" \
              --non-interactive
            echo "✅ Règles Firestore déployées"
          else
            echo "⏭️  FIREBASE_TOKEN absent — règles non déployées (build OK)"
          fi

      - name: Generate app icons
        script: dart run flutter_launcher_icons -f flutter_launcher_icons_android.yaml

      - name: Build APK and AAB
        script: |
          set -e
          mkdir -p build/outputs
          flutter build apk --release --android-skip-build-dependency-validation
          APK=$(find . -type f -name "*.apk" ! -name "*unsigned*" 2>/dev/null | grep -v ".pub-cache" | head -1)
          if [ -n "$APK" ]; then
            cp "$APK" build/outputs/crux-release.apk
            echo "✅ APK: $APK ($(du -sh "$APK" | cut -f1))"
          else
            echo "❌ No APK found."; exit 1
          fi
          flutter build appbundle --release --android-skip-build-dependency-validation
          AAB=$(find . -type f -name "*.aab" 2>/dev/null | grep -v ".pub-cache" | head -1)
          if [ -n "$AAB" ]; then
            cp "$AAB" build/outputs/crux-release.aab
            echo "✅ AAB: $AAB ($(du -sh "$AAB" | cut -f1))"
          else
            echo "❌ No AAB found."; exit 1
          fi

    artifacts:
      - build/outputs/crux-release.apk
      - build/outputs/crux-release.aab

    publishing:
      email:
        recipients:
          - kouakouchristevann@gmail.com
        notify:
          success: true
          failure: true

  # ═══════════════════════════════════════════════════════
  #  iOS RELEASE
  # ═══════════════════════════════════════════════════════
  ios-release:
    name: iOS Release - CRUX
    instance_type: mac_mini_m2
    max_build_duration: 120

    integrations:
      app_store_connect: codemagic_api_key

    environment:
      flutter: 3.24.5
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.example.crux
      groups:
        - firebase_ios
        - firebase_deploy

    scripts:
      - name: Generate iOS project files
        script: |
          if [ ! -d "ios" ]; then
            flutter create --platforms ios --org com.example --project-name crux .
            echo "✅ iOS folder generated"
          else
            echo "✅ iOS folder already exists"
          fi

      - name: Inject GoogleService-Info.plist
        script: |
          if [ -n "$GOOGLE_SERVICE_INFO_PLIST" ]; then
            echo "$GOOGLE_SERVICE_INFO_PLIST" | base64 --decode > ios/Runner/GoogleService-Info.plist
            echo "✅ GoogleService-Info.plist injecté"
          else
            echo "⚠️  GOOGLE_SERVICE_INFO_PLIST non défini"
          fi

      - name: Patch Info.plist permissions
        script: |
          PLIST="ios/Runner/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string 'CRUX a besoin de la caméra pour les vidéoconférences'" "$PLIST" 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Set :NSCameraUsageDescription 'CRUX a besoin de la caméra pour les vidéoconférences'" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :NSMicrophoneUsageDescription string 'CRUX a besoin du microphone pour les appels'" "$PLIST" 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Set :NSMicrophoneUsageDescription 'CRUX a besoin du microphone pour les appels'" "$PLIST"
          echo "✅ Info.plist patché"

      - name: Get Flutter packages
        script: flutter pub get

      - name: Deploy Firestore rules (if FIREBASE_TOKEN is set)
        script: |
          if [ -n "$FIREBASE_TOKEN" ]; then
            npm install -g firebase-tools --silent
            firebase deploy --only firestore:rules \
              --project crux-8aa85 \
              --token "$FIREBASE_TOKEN" \
              --non-interactive
            echo "✅ Règles Firestore déployées"
          else
            echo "⏭️  FIREBASE_TOKEN absent — build OK"
          fi

      - name: Generate app icons
        script: dart run flutter_launcher_icons -f flutter_launcher_icons_ios.yaml

      - name: Install CocoaPods
        script: |
          cd ios && pod install --repo-update
          echo "✅ CocoaPods installé"

      - name: Build iOS IPA
        script: |
          flutter build ipa --release \
            --export-options-plist=/Users/builder/export_options.plist \
            || flutter build ipa --release
          echo "✅ IPA buildé"

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      email:
        recipients:
          - kouakouchristevann@gmail.com
        notify:
          success: true
          failure: true
      app_store_connect:
        auth: integration
        submit_to_testflight: true
