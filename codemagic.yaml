workflows:
  android-release:
    name: Android Release - CRUX Premium
    instance_type: linux
    max_build_duration: 120
    environment:
      flutter: stable
      java: 17
      android_signing:
        - crux_keystore
      vars:
        CM_KEY_ALIAS: crux_key
    scripts:
      - name: Set up environment
        script: |
          echo "flutter.sdk=$HOME/sdks/flutter" > android/local.properties
          cat > .env << 'EOF'
AGORA_APP_ID=729bb936e5084d53897e43c58ee8e946
AGORA_APP_CERTIFICATE=93fb3c3df2d840bd94da85a24115ac43
AGORA_TOKEN_URL=http://localhost:8081/rtc
FIREBASE_PROJECT_ID=crux-8aa85
ENVIRONMENT=production
EOF

      - name: Get Flutter packages
        script: flutter pub get

      - name: Build APK release
        script: flutter build apk --release

      - name: Build AAB release
        script: flutter build appbundle --release

    artifacts:
      - build/app/outputs/apk/release/app-release.apk
      - build/app/outputs/bundle/release/app-release.aab
      - build/app/outputs/mapping/release/mapping.txt

    publishing:
      email:
        recipients:
          - kouakouchristevann@gmail.com
        notify:
          success: true
          failure: true
