workflows:
  android-release:
    name: Android Release - CRUX
    instance_type: linux
    max_build_duration: 120

    environment:
      flutter: stable
      java: 17
      android_signing:
        - crux_keystore
      vars:
        CM_KEY_ALIAS: crux_key

    scripts:
      - name: Set up local.properties
        script: |
          echo "flutter.sdk=$HOME/sdks/flutter" > android/local.properties

      - name: Patch Flutter Gradle plugin (fix afterEvaluate for AGP 8.11+)
        script: |
          GRADLE_SRC="$HOME/sdks/flutter/packages/flutter_tools/gradle/src/main/kotlin"
          echo "Flutter SDK path: $HOME/sdks/flutter"
          echo "Gradle source path: $GRADLE_SRC"

          # Verify source files exist
          echo "Source files found:"
          find "$GRADLE_SRC" -name "*.kt" -not -path "*/test/*" | sort

          # Patch: replace afterEvaluate with projectsEvaluated
          # projectsEvaluated is safe to call even after project evaluation
          find "$GRADLE_SRC" -name "*.kt" -not -path "*/test/*" | while read f; do
            count=$(grep -c "\.afterEvaluate {" "$f" 2>/dev/null || true)
            if [ "$count" -gt "0" ]; then
              sed -i 's/\.afterEvaluate {/.gradle.projectsEvaluated {/g' "$f"
              echo "Patched $count afterEvaluate(s) in: $(basename $f)"
            fi
          done

          echo "Remaining afterEvaluate calls in main sources:"
          grep -rn "afterEvaluate" "$GRADLE_SRC" --include="*.kt" \
            | grep -v "/test/" || echo "None - patch successful"

          # Clear Gradle caches to force recompilation of patched plugin
          echo "Clearing Gradle caches..."
          rm -rf ~/.gradle/caches/
          rm -rf android/.gradle/
          echo "Cache cleared - plugin will recompile from patched sources"

      - name: Get Flutter packages
        script: flutter pub get

      - name: Build APK release
        script: flutter build apk --release

      - name: Build AAB release
        script: flutter build appbundle --release

    artifacts:
      - build/app/outputs/apk/release/app-release.apk
      - build/app/outputs/bundle/release/app-release.aab

    publishing:
      email:
        recipients:
          - kouakouchristevann@gmail.com
        notify:
          success: true
          failure: true
