name: crux
description: "APPLICATION DE VISIOCONFÉRENCE"
publish_to: 'none'

environment:
  sdk: '>=3.5.0 <4.0.0'

version: 1.0.0+1

dependencies:
  flutter:
    sdk: flutter

  # Firebase — génération 3.x, compatible Dart 3.5.x / Flutter 3.24.5
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.2
  cloud_firestore: ^5.4.3
  firebase_storage: ^12.3.4
  firebase_analytics: ^11.3.3
  firebase_messaging: ^15.1.3

  # Permissions & Localization
  permission_handler: ^11.3.0
  intl: ^0.19.0
  flutter_localizations:
    sdk: flutter

  # State & Storage
  provider: ^6.1.2
  shared_preferences: ^2.3.0

  # HTTP & Utilities
  http: ^1.2.2
  uuid: ^4.2.1
  logger: ^2.1.0
  flutter_secure_storage: ^8.0.0

  # UI & Animation
  google_fonts: ^6.2.1

  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Premium UI
  flutter_animate: ^4.2.0

  # In-app video calling (WebRTC — P2P via Firebase signaling, no external service)
  flutter_webrtc: ^0.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/icon.png"
  min_sdk_android: 24
  adaptive_icon_background: "#E74C3C"
  adaptive_icon_foreground: "assets/images/icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/animation/
