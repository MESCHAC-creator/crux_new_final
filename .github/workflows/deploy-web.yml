name: Deploy Flutter Web to GitHub Pages

on:
  push:
    branches: [ schac ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.32.8'
        channel: 'stable'
        cache: true

    - name: Get dependencies
      run: flutter pub get

    - name: Build web app
      env:
        LIVEKIT_WSS_URL: ${{ secrets.LIVEKIT_WSS_URL }}
        LIVEKIT_TOKEN_SERVER_URL: ${{ secrets.LIVEKIT_TOKEN_SERVER_URL }}
        FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
      run: |
        flutter build web --release --base-href /crux_new_final/ \
          --dart-define=LIVEKIT_WSS_URL="${LIVEKIT_WSS_URL}" \
          --dart-define=LIVEKIT_TOKEN_SERVER_URL="${LIVEKIT_TOKEN_SERVER_URL}" \
          --dart-define=FIREBASE_PROJECT_ID="${FIREBASE_PROJECT_ID}" \
          --dart-define=APP_BASE_URL="${APP_BASE_URL}"

    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./build/web
        publish_branch: gh-pages
        user_name: 'github-actions[bot]'
        user_email: 'github-actions[bot]@users.noreply.github.com'
        commit_message: 'Deploy Flutter web to GitHub Pages'
