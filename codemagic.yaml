workflows:
  android-release:
    name: Android Release - CRUX
    instance_type: linux
    max_build_duration: 120

    environment:
      flutter: stable
      java: 17
      android_signing:
        - crux_keystore
      vars:
        CM_KEY_ALIAS: crux_key

    scripts:
      - name: Set up local.properties
        script: |
          echo "flutter.sdk=$HOME/sdks/flutter" > android/local.properties

      - name: Get Flutter packages
        script: flutter pub get

      - name: Build APK release
        script: flutter build apk --release

      - name: Build AAB release
        script: flutter build appbundle --release

    artifacts:
      - build/app/outputs/apk/release/app-release.apk
      - build/app/outputs/bundle/release/app-release.aab

    publishing:
      email:
        recipients:
          - kouakouchristevann@gmail.com
        notify:
          success: true
          failure: true
