name: crux
description: "APPLICATION DE VISIOCONFÉRENCE"
publish_to: 'none'

environment:
  sdk: '>=3.5.0 <4.0.0'

version: 2.34.10+1

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.2
  cloud_firestore: ^5.4.3
  firebase_messaging: ^15.1.3

  # Notifications
  flutter_local_notifications: ^17.0.0

  # Network & Connectivity
  connectivity_plus: ^6.0.3

  # Permissions & Localization
  permission_handler: ^11.3.0
  intl: any
  flutter_localizations:
    sdk: flutter

  # State & Storage
  provider: ^6.1.2
  shared_preferences: ^2.3.0

  # Utilities
  uuid: ^4.2.1
  logger: ^2.1.0

  # UI & Animation
  google_fonts: ^6.2.1
  flutter_animate: ^4.2.0

  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Video calling — WebRTC P2P via Firebase signaling
  flutter_webrtc: ">=0.11.7 <2.0.0"

  # Cryptography
  crypto: ^3.0.3

  # Monetization
  http: ^1.2.0
  url_launcher: ^6.3.0
  speech_to_text: ^6.6.0

  # Google Sign-In
  google_sign_in: ^6.2.1

  # Share
  share_plus: ^10.0.0

  # Timezone (for scheduled local notifications)
  timezone: ^0.9.4

  # Profile photo
  image_picker: ^1.1.2
  path_provider: ^2.1.4

  # Device verification & security
  device_info_plus: ^10.0.0
  package_info_plus: ^9.0.1
  flutter_secure_storage: ^9.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/icon.png"
  min_sdk_android: 24
  adaptive_icon_background: "#E74C3C"
  adaptive_icon_foreground: "assets/images/icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/animation/
