workflows:
  android-release:
    name: Android Release - CRUX
    instance_type: linux
    max_build_duration: 120

    environment:
      flutter: 3.24.5
      java: 17

    scripts:
      - name: Set up local.properties
        script: |
          FLUTTER_SDK=$(which flutter | xargs readlink -f | sed 's|/bin/flutter||')
          echo "flutter.sdk=$FLUTTER_SDK" > android/local.properties
          flutter --version

      - name: Get Flutter packages
        script: flutter pub get

      - name: Lock AGP 8.7.0 and patch afterEvaluate
        script: |
          set -e
          FLUTTER_SDK=$(which flutter | xargs readlink -f | sed 's|/bin/flutter||')

          # Re-pin AGP to 8.7.0 in case Flutter pub get upgraded it
          sed -i 's/id("com.android.application") version "[^"]*"/id("com.android.application") version "8.7.0"/' android/settings.gradle.kts
          sed -i 's/id("com.android.library") version "[^"]*"/id("com.android.library") version "8.7.0"/' android/settings.gradle.kts

          # Re-ensure android.newDsl=false
          grep -q "^android.newDsl=false" android/gradle.properties || echo "android.newDsl=false" >> android/gradle.properties

          echo "=== settings.gradle.kts AGP version ==="
          grep "com.android.application\|com.android.library" android/settings.gradle.kts
          echo "=== gradle.properties ==="
          cat android/gradle.properties

          # Patch Flutter Gradle plugin source for afterEvaluate timing fix
          echo '' | base64 -d > /tmp/patch_flutter.py
          python3 /tmp/patch_flutter.py "$FLUTTER_SDK"
          rm -rf "$FLUTTER_SDK/packages/flutter_tools/gradle/build/" 2>/dev/null || true
          rm -rf "$FLUTTER_SDK/packages/flutter_tools/gradle/.gradle/" 2>/dev/null || true
          echo "Patch done"

      - name: Generate app icons
        script: dart run flutter_launcher_icons

      - name: Build APK and AAB
        script: |
          set -e
          mkdir -p build/outputs

          # Final guard: re-apply newDsl=false right before gradle runs
          grep -q "^android.newDsl=false" android/gradle.properties || echo "android.newDsl=false" >> android/gradle.properties

          flutter build apk --release --android-skip-build-dependency-validation || true

          echo "=== APK search ==="
          find . -type f -name "*.apk" 2>/dev/null | grep -v ".pub-cache" || echo "(none)"

          APK=$(find . -type f -name "*.apk" ! -name "*unsigned*" 2>/dev/null | grep -v ".pub-cache" | head -1)
          if [ -n "$APK" ]; then
            cp "$APK" build/outputs/crux-release.apk
            echo "✅ APK: $APK ($(du -sh "$APK" | cut -f1))"
          else
            echo "❌ No APK found."
            exit 1
          fi

          flutter build appbundle --release --android-skip-build-dependency-validation || true

          AAB=$(find . -type f -name "*.aab" 2>/dev/null | grep -v ".pub-cache" | head -1)
          if [ -n "$AAB" ]; then
            cp "$AAB" build/outputs/crux-release.aab
            echo "✅ AAB: $AAB ($(du -sh "$AAB" | cut -f1))"
          fi

    artifacts:
      - build/outputs/crux-release.apk
      - build/outputs/crux-release.aab

    publishing:
      email:
        recipients:
          - kouakouchristevann@gmail.com
        notify:
          success: true
          failure: true
