name: Deploy CRUX web to GitHub Pages

on:
  push:
    branches: [ main, master, schac ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.32.8'
        channel: 'stable'
        cache: true

    - name: Get dependencies
      run: flutter pub get

    - name: Build web app
      run: |
        flutter build web -- --base-href /crux_new_final/ \
          --dart-define=LKIT_WSS_URL="wsscrux-88fihb12.livekit.cloud" \
          --dart-define=LIVEKIT_TOKEN_SERVER_URL="https://crux-6l6num.sandbox.livekit.io" \
          --dart-define=FIREBASE_PROJECT_ID="crux-3c6be"


    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./build/web
        publish_branch: schac
        user_name: 'schac-hub'
 user_email: 'kouakouchristevann@gmail.com'
        commit_message: 'Deployed CRUX web to GitHub Pages'
