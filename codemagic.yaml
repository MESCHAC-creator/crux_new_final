workflows:

  # ═══════════════════════════════════════════════════════
  #  ANDROID RELEASE
  # ═══════════════════════════════════════════════════════
  android-release:
    name: Android Release - CRUX
    instance_type: linux
    max_build_duration: 120

    environment:
      flutter: 3.24.5
      java: 17

    scripts:
      - name: Set up local.properties
        script: |
          FLUTTER_SDK=$(which flutter | xargs readlink -f | sed 's|/bin/flutter||')
          echo "flutter.sdk=$FLUTTER_SDK" > android/local.properties
          flutter --version

      - name: Get Flutter packages
        script: flutter pub get

      - name: Lock AGP 8.7.0 and patch afterEvaluate
        script: |
          set -e
          FLUTTER_SDK=$(which flutter | xargs readlink -f | sed 's|/bin/flutter||')
          sed -i 's/id("com.android.application") version "[^"]*"/id("com.android.application") version "8.7.0"/' android/settings.gradle.kts
          sed -i 's/id("com.android.library") version "[^"]*"/id("com.android.library") version "8.7.0"/' android/settings.gradle.kts
          grep -q "^android.newDsl=false" android/gradle.properties || echo "android.newDsl=false" >> android/gradle.properties
          echo '' | base64 -d > /tmp/patch_flutter.py
          python3 /tmp/patch_flutter.py "$FLUTTER_SDK"
          rm -rf "$FLUTTER_SDK/packages/flutter_tools/gradle/build/" 2>/dev/null || true
          rm -rf "$FLUTTER_SDK/packages/flutter_tools/gradle/.gradle/" 2>/dev/null || true
          echo "Patch done"

      - name: Generate app icons
        script: dart run flutter_launcher_icons

      - name: Build APK and AAB
        script: |
          set -e
          mkdir -p build/outputs
          grep -q "^android.newDsl=false" android/gradle.properties || echo "android.newDsl=false" >> android/gradle.properties
          flutter build apk --release --android-skip-build-dependency-validation || true
          echo "=== APK search ==="
          find . -type f -name "*.apk" 2>/dev/null | grep -v ".pub-cache" || echo "(none)"
          APK=$(find . -type f -name "*.apk" ! -name "*unsigned*" 2>/dev/null | grep -v ".pub-cache" | head -1)
          if [ -n "$APK" ]; then
            cp "$APK" build/outputs/crux-release.apk
            echo "✅ APK: $APK ($(du -sh "$APK" | cut -f1))"
          else
            echo "❌ No APK found."; exit 1
          fi
          flutter build appbundle --release --android-skip-build-dependency-validation || true
          AAB=$(find . -type f -name "*.aab" 2>/dev/null | grep -v ".pub-cache" | head -1)
          if [ -n "$AAB" ]; then
            cp "$AAB" build/outputs/crux-release.aab
            echo "✅ AAB: $AAB ($(du -sh "$AAB" | cut -f1))"
          fi

    artifacts:
      - build/outputs/crux-release.apk
      - build/outputs/crux-release.aab

    publishing:
      email:
        recipients:
          - kouakouchristevann@gmail.com
        notify:
          success: true
          failure: true

  # ═══════════════════════════════════════════════════════
  #  iOS RELEASE
  #
  #  AVANT DE LANCER CE BUILD, configure dans Codemagic :
  #  1. Team → Integrations → App Store Connect API Key
  #     (Key ID, Issuer ID, Private Key .p8)
  #  2. Variables d'environnement (groupe "firebase_ios") :
  #     GOOGLE_SERVICE_INFO_PLIST = contenu de GoogleService-Info.plist
  #     encodé en base64 :
  #     base64 -i GoogleService-Info.plist | tr -d '\n'
  # ═══════════════════════════════════════════════════════
  ios-release:
    name: iOS Release - CRUX
    instance_type: mac_mini_m2
    max_build_duration: 120

    integrations:
      app_store_connect: codemagic_api_key  # remplace par le nom de ta clé dans Codemagic

    environment:
      flutter: 3.24.5
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.example.crux
      groups:
        - firebase_ios  # groupe contenant GOOGLE_SERVICE_INFO_PLIST

    scripts:
      - name: Generate iOS project files
        script: |
          # Crée le dossier ios/ s'il est absent (projet Flutter sans iOS initialisé)
          if [ ! -d "ios" ]; then
            flutter create --platforms ios --org com.example --project-name crux .
            echo "✅ iOS folder generated"
          else
            echo "✅ iOS folder already exists"
          fi

      - name: Inject GoogleService-Info.plist
        script: |
          # Décode le fichier Firebase iOS depuis la variable d'environnement
          if [ -n "$GOOGLE_SERVICE_INFO_PLIST" ]; then
            echo "$GOOGLE_SERVICE_INFO_PLIST" | base64 --decode > ios/Runner/GoogleService-Info.plist
            echo "✅ GoogleService-Info.plist injecté"
          else
            echo "⚠️  GOOGLE_SERVICE_INFO_PLIST non défini — Firebase iOS peut échouer"
          fi

      - name: Patch Info.plist permissions
        script: |
          PLIST="ios/Runner/Info.plist"
          # Caméra
          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string 'CRUX a besoin de la caméra pour les vidéoconférences'" "$PLIST" 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Set :NSCameraUsageDescription 'CRUX a besoin de la caméra pour les vidéoconférences'" "$PLIST"
          # Micro
          /usr/libexec/PlistBuddy -c "Add :NSMicrophoneUsageDescription string 'CRUX a besoin du microphone pour les appels'" "$PLIST" 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Set :NSMicrophoneUsageDescription 'CRUX a besoin du microphone pour les appels'" "$PLIST"
          # URL schemes pour url_launcher
          /usr/libexec/PlistBuddy -c "Add :LSApplicationQueriesSchemes array" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :LSApplicationQueriesSchemes:0 string 'https'" "$PLIST" 2>/dev/null || true
          echo "✅ Info.plist patché"

      - name: Get Flutter packages
        script: flutter pub get

      - name: Generate app icons
        script: dart run flutter_launcher_icons

      - name: Install CocoaPods
        script: |
          cd ios && pod install --repo-update
          echo "✅ CocoaPods installé"

      - name: Build iOS IPA
        script: |
          flutter build ipa --release \
            --export-options-plist=/Users/builder/export_options.plist \
            || flutter build ipa --release
          echo "✅ IPA buildé"

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      email:
        recipients:
          - kouakouchristevann@gmail.com
        notify:
          success: true
          failure: true
      app_store_connect:
        auth: integration
        submit_to_testflight: true
