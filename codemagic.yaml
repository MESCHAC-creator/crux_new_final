workflows:

  # ═══════════════════════════════════════════════════════
  #  ANDROID RELEASE
  # ═══════════════════════════════════════════════════════
  android-release:
    name: Android Release - CRUX
    instance_type: linux
    max_build_duration: 120

    environment:
      flutter: 3.29.2
      java: 17
      groups:
        - firebase_deploy   # contient FIREBASE_TOKEN (optionnel)

    scripts:
      - name: Set up local.properties
        script: |
          FLUTTER_SDK=$(which flutter | xargs readlink -f | sed 's|/bin/flutter||')
          echo "flutter.sdk=$FLUTTER_SDK" > android/local.properties
          flutter --version

      - name: Get Flutter packages
        script: flutter pub get

      - name: Pre-install NDK + guard afterEvaluate
        script: |
          set -e
          FLUTTER_SDK=$(which flutter | xargs readlink -f | sed 's|/bin/flutter||')
          ANDROID_SDK="${ANDROID_SDK_ROOT:-/usr/local/share/android-sdk}"
          NDK_VERSION="25.1.8937393"

          # ── 1. Install NDK before Gradle runs ──────────────────────────────────
          # agora_rtc_engine declares externalNativeBuild which requires NDK.
          # If NDK is absent, AGP tries to download it during configuration phase,
          # which evaluates the project early → Flutter's afterEvaluate crash.
          if [ ! -d "$ANDROID_SDK/ndk/$NDK_VERSION" ]; then
            SDKMANAGER=""
            for c in \
              "$ANDROID_SDK/cmdline-tools/latest/bin/sdkmanager" \
              "$ANDROID_SDK/cmdline-tools/latest-2/bin/sdkmanager" \
              "$(which sdkmanager 2>/dev/null)"; do
              [ -x "$c" ] && SDKMANAGER="$c" && break
            done
            if [ -n "$SDKMANAGER" ]; then
              yes | "$SDKMANAGER" "ndk;$NDK_VERSION" 2>/dev/null \
                && echo "NDK $NDK_VERSION installed" \
                || echo "NDK sdkmanager install skipped (non-fatal)"
            fi
          else
            echo "NDK $NDK_VERSION already present"
          fi

          # ── 2. Symlink NDK into the path AGP prefers ────────────────────────────
          # AGP 8.3 looks for ndk at both $ANDROID_SDK/ndk/<ver> and ndk-bundle.
          # Creating a symlink ensures it's found without any re-resolution.
          if [ -d "$ANDROID_SDK/ndk/$NDK_VERSION" ]; then
            ln -sfn "$ANDROID_SDK/ndk/$NDK_VERSION" "$ANDROID_SDK/ndk-bundle" 2>/dev/null || true
            echo "NDK symlink OK"
          fi

          # ── 3. Patch Flutter tools source + force recompile ─────────────────────
          # Flutter 3.29 largely removed afterEvaluate but some paths remain.
          # We patch AND pre-compile the plugin JAR so the patched code is active.
          FLUTTER_GRADLE="$FLUTTER_SDK/packages/flutter_tools/gradle"

          # Patch all .kt files: wrap afterEvaluate{} calls with state guard
          find "$FLUTTER_GRADLE/src" -name "*.kt" 2>/dev/null | while read -r f; do
            if grep -q 'afterEvaluate' "$f"; then
              # Replace: foo.afterEvaluate { → if(foo.state.executed){ } else { foo.afterEvaluate { } }
              perl -i -0pe \
                's/(\w+)\.afterEvaluate\s*\{/if(\1.state.executed)\{\/\/ immediate\n\} else \{\n\1.afterEvaluate \{/g' \
                "$f" 2>/dev/null || true
              echo "Patched: $f"
            fi
          done

          # Delete stale compiled artifacts so Gradle recompiles from patched source
          rm -rf "$FLUTTER_GRADLE/build/" "$FLUTTER_GRADLE/.gradle/"
          # Also clear the Gradle build-cache and file-hash cache
          rm -rf "$HOME/.gradle/caches/build-cache-"*
          rm -rf "$HOME/.gradle/caches/"*/fileHashes
          rm -rf "$HOME/.gradle/caches/"*/executionHistory
          echo "Flutter Gradle plugin patched and caches cleared"

      - name: Deploy Firestore rules (if FIREBASE_TOKEN is set)
        script: |
          if [ -n "$FIREBASE_TOKEN" ]; then
            npm install -g firebase-tools --silent
            firebase deploy --only firestore:rules \
              --project crux-8aa85 \
              --token "$FIREBASE_TOKEN" \
              --non-interactive
            echo "✅ Règles Firestore déployées"
          else
            echo "⏭️  FIREBASE_TOKEN absent — build OK"
          fi

      - name: Generate app icons
        script: dart run flutter_launcher_icons -f flutter_launcher_icons_android.yaml

      - name: Build APK and AAB
        script: |
          set -e
          mkdir -p build/outputs
          flutter build apk --release --android-skip-build-dependency-validation
          APK=$(find . -type f -name "*.apk" ! -name "*unsigned*" 2>/dev/null | grep -v ".pub-cache" | head -1)
          if [ -n "$APK" ]; then
            cp "$APK" build/outputs/crux-release.apk
            echo "✅ APK: $APK ($(du -sh "$APK" | cut -f1))"
          else
            echo "❌ No APK found."; exit 1
          fi
          flutter build appbundle --release --android-skip-build-dependency-validation
          AAB=$(find . -type f -name "*.aab" 2>/dev/null | grep -v ".pub-cache" | head -1)
          if [ -n "$AAB" ]; then
            cp "$AAB" build/outputs/crux-release.aab
            echo "✅ AAB: $AAB ($(du -sh "$AAB" | cut -f1))"
          else
            echo "❌ No AAB found."; exit 1
          fi

    artifacts:
      - build/outputs/crux-release.apk
      - build/outputs/crux-release.aab

    publishing:
      email:
        recipients:
          - kouakouchristevann@gmail.com
        notify:
          success: true
          failure: true

  # ═══════════════════════════════════════════════════════
  #  iOS RELEASE
  # ═══════════════════════════════════════════════════════
  ios-release:
    name: iOS Release - CRUX
    instance_type: mac_mini_m2
    max_build_duration: 120

    integrations:
      app_store_connect: codemagic_api_key

    environment:
      flutter: 3.29.2
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.cruxapp.mobile
      groups:
        - firebase_ios
        - firebase_deploy

    scripts:
      - name: Generate iOS project files
        script: |
          set -e
          if [ ! -d "ios" ]; then
            flutter create --platforms ios --org com.cruxapp --project-name mobile .
            echo "✅ iOS folder generated"
          else
            echo "✅ iOS folder already exists"
          fi
          # Ensure bundle ID is correct in project.pbxproj
          PBXPROJ="ios/Runner.xcodeproj/project.pbxproj"
          if [ -f "$PBXPROJ" ]; then
            sed -i '' 's/PRODUCT_BUNDLE_IDENTIFIER = [^;]*/PRODUCT_BUNDLE_IDENTIFIER = com.cruxapp.mobile/g' "$PBXPROJ" || \
            sed -i 's/PRODUCT_BUNDLE_IDENTIFIER = [^;]*/PRODUCT_BUNDLE_IDENTIFIER = com.cruxapp.mobile/g' "$PBXPROJ"
            echo "✅ Bundle ID patché dans project.pbxproj"
          fi

      - name: Inject GoogleService-Info.plist
        script: |
          if [ -n "$GOOGLE_SERVICE_INFO_PLIST" ]; then
            echo "$GOOGLE_SERVICE_INFO_PLIST" | base64 --decode > ios/Runner/GoogleService-Info.plist
            echo "✅ GoogleService-Info.plist injecté"
          else
            echo "⚠️  GOOGLE_SERVICE_INFO_PLIST absent — Firebase iOS désactivé"
          fi

      - name: Patch Info.plist permissions
        script: |
          set -e
          PLIST="ios/Runner/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string 'CRUX needs the camera for video conferences'" "$PLIST" 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Set :NSCameraUsageDescription 'CRUX needs the camera for video conferences'" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :NSMicrophoneUsageDescription string 'CRUX needs the microphone for calls'" "$PLIST" 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Set :NSMicrophoneUsageDescription 'CRUX needs the microphone for calls'" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string 'CRUX'" "$PLIST" 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName 'CRUX'" "$PLIST"
          echo "✅ Info.plist patché"

      - name: Get Flutter packages
        script: flutter pub get

      - name: Deploy Firestore rules (if FIREBASE_TOKEN is set)
        script: |
          if [ -n "$FIREBASE_TOKEN" ]; then
            npm install -g firebase-tools --silent
            firebase deploy --only firestore:rules \
              --project crux-8aa85 \
              --token "$FIREBASE_TOKEN" \
              --non-interactive
            echo "✅ Règles Firestore déployées"
          else
            echo "⏭️  FIREBASE_TOKEN absent — build OK"
          fi

      - name: Generate app icons
        script: dart run flutter_launcher_icons -f flutter_launcher_icons_ios.yaml

      - name: Install CocoaPods
        script: |
          set -e
          cd ios
          pod repo update
          pod install
          echo "✅ CocoaPods installé"

      - name: Build iOS IPA
        script: |
          set -e
          flutter build ipa --release \
            --export-options-plist=/Users/builder/export_options.plist
          echo "✅ IPA buildé"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      email:
        recipients:
          - kouakouchristevann@gmail.com
        notify:
          success: true
          failure: true
      app_store_connect:
        auth: integration
        submit_to_testflight: true
