# Gradle Performance
org.gradle.jvmargs=-Xmx2G -Dfile.encoding=UTF-8 -XX:MaxMetaspaceSize=512m
org.gradle.workers.max=2
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.daemon=true
org.gradle.configuration-cache=false

# Android Build Options
android.useAndroidX=true
android.enableJetifier=true
android.compileSdkVersion=34
android.targetSdkVersion=34
android.minSdkVersion=21
android.ndkVersion=25.2.9519653

# Build Cache
android.enableBuildCache=true
android.gradle.bundleStore=true
android.enableShrinkResourcesInLibraries=false

# Kotlin
kotlin.code.style=official
kotlin.incremental=true
kotlin.incremental.java=true
kotlin.daemon.jvmargs=-Xmx2G

# R8/ProGuard
android.enableR8=true
android.enableR8.fullMode=false

# Suppresses AndroidX migration warnings
android.suppressUnsupportedCompileSdkWarning=false

# Disable legacy multidex
android.useMultidex=false

# DSL
android.newDsl=false

# Dexing
android.enableDexingArtifactTransform=true
android.dexOptionsEnableLegacyDexTransform=false
