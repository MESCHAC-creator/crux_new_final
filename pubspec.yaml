name: crux
description: "APPLICATION DE VISIOCONFÉRENCE"
publish_to: 'none'

environment:
  sdk: '>=3.5.0 <4.0.0'

version: 1.0.0+1

dependencies:
  flutter:
    sdk: flutter

  # Firebase — génération 3.x, compatible Dart 3.5.x / Flutter 3.24.5
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.2
  cloud_firestore: ^5.4.3
  firebase_storage: ^12.3.4
  firebase_analytics: ^11.3.3
  firebase_messaging: ^15.1.3

  # Agora - VIDEO CONFERENCING
  agora_rtc_engine: ^6.6.3

  # URL Launcher
  url_launcher: ^6.3.0

  # Permissions & Localization
  permission_handler: ^11.4.0
  intl: ^0.19.0
  flutter_localizations:
    sdk: flutter

  # State & Storage
  provider: ^6.1.2
  shared_preferences: ^2.2.3

  # HTTP & Utilities
  http: ^1.2.2
  dio: ^5.4.0
  uuid: ^4.2.1
  logger: ^2.1.0
  flutter_dotenv: ^5.1.0
  flutter_secure_storage: ^8.1.0

  # UI & Animation
  lottie: ^3.3.0
  google_fonts: ^6.2.1

  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Premium UI
  flutter_animate: ^4.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.0

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/logo.png"
  min_sdk_android: 24

flutter:
  uses-material-design: true
  assets:
    - assets/images/
