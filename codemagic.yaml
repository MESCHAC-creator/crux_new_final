workflows:
  # ═══════════════════════════════════════════════════════
  # ANDROID RELEASE — APK + AAB
  # ═══════════════════════════════════════════════════════
  android-release:
    name: Android Release - CRUX
    instance_type: linux_x2
    max_build_duration: 120

    environment:
      flutter: 3.27.0
      java: 17
      android_signing:
        - crux_keystore
      groups:
        - firebase_credentials

    cache:
      cache_paths:
        - $FLUTTER_ROOT/.pub-cache
        - $HOME/.gradle/caches

    scripts:
      - name: Clean and setup
        script: |
          flutter clean
          flutter pub get
          flutter --version

      - name: Set up local.properties
        script: |
          FLUTTER_SDK=$(which flutter | xargs readlink -f | sed 's|/bin/flutter||')
          echo "flutter.sdk=$FLUTTER_SDK" > android/local.properties

      - name: Set up key.properties
        script: |
          cat > android/key.properties <<EOF
          storePassword=$CM_KEYSTORE_PASSWORD
          keyPassword=$CM_KEY_PASSWORD
          keyAlias=$CM_KEY_ALIAS
          storeFile=$CM_KEYSTORE_PATH
          EOF

      - name: Analyze code
        script: |
          flutter analyze --fatal-infos || true

      - name: Run tests
        script: |
          flutter test || true

      - name: Build APK
        script: |
          flutter build apk --release \
            --target-platform android-arm64 \
            --build-name=2.38.1 \
            --build-number=4

      - name: Build AAB
        script: |
          flutter build appbundle --release \
            --build-name=2.38.1 \
            --build-number=4

      - name: Copy artifacts
        script: |
          mkdir -p build/outputs
          cp build/app/outputs/flutter-apk/app-release.apk build/outputs/crux-release.apk
          cp build/app/outputs/bundle/release/app-release.aab build/outputs/crux-release.aab

      - name: Deploy to Firebase App Distribution
        script: |
          curl -sL https://firebase.tools | bash
          firebase appdistribution:distribute build/outputs/crux-release.apk \
            --app "1:33175700363:android:47532d59f11f2e1a66658e" \
            --groups "testers" \
            --release-notes "CRUX v2.38.1 Build 4" \
            --token "$FIREBASE_TOKEN"

    artifacts:
      - build/outputs/crux-release.apk
      - build/outputs/crux-release.aab

    publishing:
      email:
        recipients:
          - kouakouchristevann@gmail.com
        notify:
          success: true
          failure: true
