workflows:
  android-release:
    name: Android Release - CRUX
    instance_type: linux
    max_build_duration: 120

    environment:
      flutter: master
      java: 17
      android_signing:
        - crux_keystore
      vars:
        CM_KEY_ALIAS: crux_key

    scripts:
      - name: Set up local.properties
        script: |
          FLUTTER_SDK=$(which flutter | xargs readlink -f | sed 's|/bin/flutter||')
          echo "flutter.sdk=$FLUTTER_SDK" > android/local.properties
          echo "Flutter SDK: $FLUTTER_SDK"
          flutter --version

      - name: Reset Flutter Gradle plugin to original state
        script: |
          FLUTTER_SDK=$(which flutter | xargs readlink -f | sed 's|/bin/flutter||')
          GRADLE_SRC="$FLUTTER_SDK/packages/flutter_tools/gradle/src/main/kotlin"

          echo "=== Undoing any previous patches (projectsEvaluated -> afterEvaluate) ==="
          find "$GRADLE_SRC" -name "*.kt" | while IFS= read -r f; do
            if grep -q "gradle\.projectsEvaluated { with(" "$f" 2>/dev/null; then
              sed -i 's/\(\w\+\)\.gradle\.projectsEvaluated { with(\w\+!!) {/\1.afterEvaluate {/g' "$f"
              # Fix double closing braces added by previous patch
              sed -i 's/} }\s*$/}/g' "$f"
              echo "  RESTORED: $(basename "$f")"
            fi
          done

          echo "=== Trying git reset as additional safety ==="
          git -C "$FLUTTER_SDK" checkout -- packages/flutter_tools/gradle/src/ 2>/dev/null \
            && echo "  git reset OK" || echo "  git reset skipped (not a git repo)"

          echo "=== Verify: afterEvaluate calls present (expected with Flutter 3.29.0) ==="
          COUNT=$(grep -rn "\.afterEvaluate {" "$GRADLE_SRC" --include="*.kt" | grep -v "/test/" | wc -l 2>/dev/null || echo 0)
          echo "  $COUNT afterEvaluate call(s) found (will be handled by android.newDsl=false)"

          echo "=== Clear all compiled Gradle caches ==="
          rm -rf "$FLUTTER_SDK/packages/flutter_tools/gradle/build/" 2>/dev/null || true
          rm -rf "$FLUTTER_SDK/packages/flutter_tools/gradle/.gradle/" 2>/dev/null || true
          rm -rf ~/.gradle/caches/ 2>/dev/null || true
          echo "Done - AGP 8.7.0 + android.newDsl=false handles afterEvaluate natively"

      - name: Get Flutter packages
        script: flutter pub get

      - name: Build APK release
        script: flutter build apk --release

      - name: Build AAB release
        script: flutter build appbundle --release

    artifacts:
      - build/app/outputs/apk/release/app-release.apk
      - build/app/outputs/bundle/release/app-release.aab

    publishing:
      email:
        recipients:
          - kouakouchristevann@gmail.com
        notify:
          success: true
          failure: true
