workflows:
  # ═══════════════════════════════════════════════════════
  # ANDROID RELEASE
  # ═══════════════════════════════════════════════════════
  android-release:
    name: Android Release - CRUX
    instance_type: linux_x2  # Plus puissant pour builds lourds
    max_build_duration: 120

    environment:
      flutter: 3.27.0  # ✅ VERSION PINNÉE (stable, reproductible)
      java: 17
      android_signing:
        - crux_keystore
      groups:
        - firebase_deploy

    cache:
      cache_paths:
        - $FLUTTER_ROOT/.pub-cache
        - $HOME/.gradle/caches

    scripts:
      - name: Clean and setup
        script: |
          flutter clean
          flutter pub get
          flutter --version

      - name: Set up local.properties
        script: |
          FLUTTER_SDK=$(which flutter | xargs readlink -f | sed 's|/bin/flutter||')
          echo "flutter.sdk=$FLUTTER_SDK" > android/local.properties

      - name: Set up key.properties
        script: |
          cat > android/key.properties <<EOF
          storePassword=$CM_KEYSTORE_PASSWORD
          keyPassword=$CM_KEY_PASSWORD
          keyAlias=$CM_KEY_ALIAS
          storeFile=$CM_KEYSTORE_PATH
          EOF

      - name: Analyze code
        script: |
          flutter analyze --fatal-infos || true

      - name: Run tests
        script: |
          flutter test || true

      - name: Build APK
        script: |
          flutter build apk --release \
            --target-platform android-arm64 \
            --build-name=2.38.1 \
            --build-number=4

      - name: Build AAB
        script: |
          flutter build appbundle --release \
            --build-name=2.38.1 \
            --build-number=4

      - name: Copy artifacts
        script: |
          mkdir -p build/outputs
          cp build/app/outputs/flutter-apk/app-release.apk build/outputs/crux-release.apk
          cp build/app/outputs/bundle/release/app-release.aab build/outputs/crux-release.aab

    artifacts:
      - build/outputs/crux-release.apk
      - build/outputs/crux-release.aab

    publishing:
      email:
        recipients:
          - kouakouchristevann@gmail.com
        notify:
          success: true
          failure: true
      firebase_app_distribution:
        android:
          app_id: 1:YOUR_APP_ID:android:YOUR_APP_ID
          groups:
            - testers

  # ═══════════════════════════════════════════════════════
  # iOS RELEASE
  # ═══════════════════════════════════════════════════════
  ios-release:
    name: iOS Release - CRUX
    instance_type: mac_mini_m2
    max_build_duration: 120

    integrations:
      app_store_connect: codemagic_api_key

    environment:
      flutter: 3.27.0  # ✅ VERSION PINNÉE
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.schac-crux.app
      groups:
        - firebase_ios
        - firebase_deploy

    cache:
      cache_paths:
        - $FLUTTER_ROOT/.pub-cache
        - ios/Pods

    scripts:
      - name: Clean and setup
        script: |
          flutter clean
          flutter pub get

      - name: Generate iOS project files
        script: |
          set -e
          if [ ! -d "ios" ]; then
            flutter create --platforms ios --org com.schac-crux --project-name crux .
          fi
          PBXPROJ="ios/Runner.xcodeproj/project.pbxproj"
          if [ -f "$PBXPROJ" ]; then
            sed -i '' 's/PRODUCT_BUNDLE_IDENTIFIER = [^;]*/PRODUCT_BUNDLE_IDENTIFIER = com.schac-crux.app/g' "$PBXPROJ" || \
            sed -i 's/PRODUCT_BUNDLE_IDENTIFIER = [^;]*/PRODUCT_BUNDLE_IDENTIFIER = com.schac-crux.app/g' "$PBXPROJ"
          fi

      - name: Inject GoogleService-Info.plist
        script: |
          if [ -n "$GOOGLE_SERVICE_INFO_PLIST" ]; then
            echo "$GOOGLE_SERVICE_INFO_PLIST" | base64 --decode > ios/Runner/GoogleService-Info.plist
          fi

      - name: Patch Info.plist permissions
        script: |
          set -e
          PLIST="ios/Runner/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string 'CRUX needs the camera for video conferences'" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSMicrophoneUsageDescription string 'CRUX needs the microphone for calls'" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryUsageDescription string 'CRUX needs access to photos for profile pictures'" "$PLIST" 2>/dev/null || true

      - name: Generate app icons
        script: |
          dart run flutter_launcher_icons -f flutter_launcher_icons_ios.yaml

      - name: Install CocoaPods
        script: |
          cd ios
          pod repo update
          pod install --repo-update

      - name: Build iOS IPA
        script: |
          flutter build ipa --release \
            --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
