workflows:

  # ═══════════════════════════════════════════════════════
  #  ANDROID RELEASE
  # ═══════════════════════════════════════════════════════
  android-release:
    name: Android Release - CRUX
    instance_type: linux
    max_build_duration: 120

    environment:
      flutter: stable
      java: 21
      android_signing:
        - crux_keystore
      groups:
        - firebase_deploy

    scripts:
      - name: Set up local.properties
        script: |
          FLUTTER_SDK=$(which flutter | xargs readlink -f | sed 's|/bin/flutter||')
          echo "flutter.sdk=$FLUTTER_SDK" > android/local.properties
          flutter --version

      - name: Inject Secrets (.env & google-services.json)
        script: |
          # 1. Decode google-services.json if GOOGLE_SERVICES_JSON is set
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" | base64 --decode > android/app/google-services.json
            echo "✅ android/app/google-services.json injecté"
          else
            echo "⚠️ GOOGLE_SERVICES_JSON non défini dans les variables Codemagic"
          fi

          # 2. Create .env from environment variables if needed
          # Even if not used by flutter_dotenv yet, we create it to prevent crashes if added.
          echo "SUPABASE_URL=$SUPABASE_URL" > .env
          echo "SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY" >> .env
          echo "LIVEKIT_URL=$LIVEKIT_URL" >> .env
          echo "LIVEKIT_API_KEY=$LIVEKIT_API_KEY" >> .env
          echo "LIVEKIT_API_SECRET=$LIVEKIT_API_SECRET" >> .env
          echo "✅ Fichier .env généré"

      - name: Set up key.properties
        script: |
          cat > android/key.properties <<EOF
          storePassword=$CM_KEYSTORE_PASSWORD
          keyPassword=$CM_KEY_PASSWORD
          keyAlias=$CM_KEY_ALIAS
          storeFile=$CM_KEYSTORE_PATH
          EOF
          echo "✅ key.properties généré"

      - name: Get Flutter packages
        script: |
          flutter pub get

      - name: Deploy Firestore rules (if FIREBASE_TOKEN is set)
        script: |
          if [ -n "$FIREBASE_TOKEN" ]; then
            npm install -g firebase-tools --silent
            firebase deploy --only firestore:rules \
              --project crux-3c6be \
              --token "$FIREBASE_TOKEN" \
              --non-interactive
            echo "✅ Règles Firestore déployées"
          else
            echo "⏭️  FIREBASE_TOKEN absent — build OK"
          fi

      - name: Patch flutter_webrtc (remove V1 embedding)
        script: |
          python3 - <<'PYEOF'
          import re, glob, os
          pattern = os.path.expanduser(
              '~/.pub-cache/hosted/pub.dev/flutter_webrtc*/android/src/main/java/com/cloudwebrtc/webrtc/FlutterWebRTCPlugin.java'
          )
          files = glob.glob(pattern)
          if not files:
              print('flutter_webrtc plugin not found, skipping patch')
              exit(0)
          for path in files:
              with open(path, 'r') as f:
                  content = f.read()
              original = content
              content = re.sub(
                  r'import io\.flutter\.plugin\.common\.PluginRegistry\.Registrar;\n',
                  '', content)
              content = re.sub(
                  r'\n[ \t]+public static void registerWith\(Registrar[^)]*\) \{[^}]*\}',
                  '', content)
              if content != original:
                  with open(path, 'w') as f:
                      f.write(content)
                  print(f'Patched: {path}')
              else:
                  print(f'No changes needed: {path}')
          PYEOF

      - name: Prepare Gradle wrapper
        script: |
          set -e
          cd android
          # Force Linux line endings on gradlew
          sed -i 's/\r$//' gradlew
          chmod +x gradlew
          
          # Ensure healthy wrapper binary (8.12.0 for Java 21 compatibility)
          mkdir -p gradle/wrapper
          curl -L -f -s -o gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/v8.12.0/gradle/wrapper/gradle-wrapper.jar

          ./gradlew -v

      - name: Generate app icons
        script: dart run flutter_launcher_icons -f flutter_launcher_icons_android.yaml

      - name: Build APK and AAB
        script: |
          set -e
          mkdir -p build/outputs
          BUILD_FLAGS="--release --no-tree-shake-icons --android-skip-build-dependency-validation"

          echo "=== FLUTTER BUILD APK ($BUILD_FLAGS) ==="
          flutter build apk $BUILD_FLAGS 2>&1 | tail -300

          APK=$(find build/app/outputs/flutter-apk -name "app-release.apk" 2>/dev/null | head -1)
          [ -z "$APK" ] && APK=$(find build/app/outputs/apk -name "app-release.apk" 2>/dev/null | head -1)
          [ -z "$APK" ] && APK=$(find . -name "app-release.apk" ! -path "*/.pub-cache/*" ! -path "*/debug/*" 2>/dev/null | head -1)

          if [ -z "$APK" ]; then
            echo "❌ APK not found"
            exit 1
          fi
          cp "$APK" build/outputs/crux-release.apk

          echo "=== FLUTTER BUILD AAB ($BUILD_FLAGS) ==="
          flutter build appbundle $BUILD_FLAGS 2>&1 | tail -300

          AAB=$(find build/app/outputs/bundle -name "app-release.aab" 2>/dev/null | head -1)
          [ -z "$AAB" ] && AAB=$(find . -name "app-release.aab" ! -path "*/.pub-cache/*" 2>/dev/null | head -1)

          if [ -z "$AAB" ]; then
            echo "❌ AAB not found"
            exit 1
          fi
          cp "$AAB" build/outputs/crux-release.aab

    artifacts:
      - build/outputs/crux-release.apk
      - build/outputs/crux-release.aab

    publishing:
      email:
        recipients:
          - kouakouchristevann@gmail.com
        notify:
          success: true
          failure: true

  # ═══════════════════════════════════════════════════════
  #  iOS RELEASE
  # ═══════════════════════════════════════════════════════
  ios-release:
    name: iOS Release - CRUX
    instance_type: mac_mini_m2
    max_build_duration: 120

    integrations:
      app_store_connect: codemagic_api_key

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.schac-crux.app
      groups:
        - firebase_ios
        - firebase_deploy

    scripts:
      - name: Generate iOS project files
        script: |
          set -e
          if [ ! -d "ios" ]; then
            flutter create --platforms ios --org com.schac-crux --project-name crux .
          fi
          PBXPROJ="ios/Runner.xcodeproj/project.pbxproj"
          if [ -f "$PBXPROJ" ]; then
            sed -i '' 's/PRODUCT_BUNDLE_IDENTIFIER = [^;]*/PRODUCT_BUNDLE_IDENTIFIER = com.schac-crux.app/g' "$PBXPROJ" || \
            sed -i 's/PRODUCT_BUNDLE_IDENTIFIER = [^;]*/PRODUCT_BUNDLE_IDENTIFIER = com.schac-crux.app/g' "$PBXPROJ"
          fi

      - name: Inject GoogleService-Info.plist
        script: |
          if [ -n "$GOOGLE_SERVICE_INFO_PLIST" ]; then
            echo "$GOOGLE_SERVICE_INFO_PLIST" | base64 --decode > ios/Runner/GoogleService-Info.plist
          fi

      - name: Patch Info.plist permissions
        script: |
          set -e
          PLIST="ios/Runner/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string 'CRUX needs the camera for video conferences'" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSMicrophoneUsageDescription string 'CRUX needs the microphone for calls'" "$PLIST" 2>/dev/null || true

      - name: Get Flutter packages
        script: flutter pub get

      - name: Generate app icons
        script: dart run flutter_launcher_icons -f flutter_launcher_icons_ios.yaml

      - name: Install CocoaPods
        script: |
          cd ios
          pod repo update
          pod install

      - name: Build iOS IPA
        script: |
          flutter build ipa --release \
            --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
