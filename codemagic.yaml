workflows:
  android-release:
    name: Android Release - CRUX
    instance_type: linux
    max_build_duration: 120

    environment:
      flutter: master
      java: 17
      android_signing:
        - crux_keystore
      vars:
        CM_KEY_ALIAS: crux_key

    scripts:
      - name: Set up local.properties
        script: |
          FLUTTER_SDK=$(which flutter | xargs readlink -f | sed 's|/bin/flutter||')
          echo "flutter.sdk=$FLUTTER_SDK" > android/local.properties
          echo "Flutter SDK path: $FLUTTER_SDK"

      - name: Patch Flutter Gradle plugin and clear ALL caches
        script: |
          FLUTTER_SDK=$(which flutter | xargs readlink -f | sed 's|/bin/flutter||')
          GRADLE_SRC="$FLUTTER_SDK/packages/flutter_tools/gradle/src/main/kotlin"

          echo "=== Step 1: Verify Flutter SDK path ==="
          echo "Using Flutter SDK at: $FLUTTER_SDK"
          ls "$FLUTTER_SDK/packages/flutter_tools/gradle/" || { echo "ERROR: Flutter SDK not found at $FLUTTER_SDK"; exit 1; }

          echo "=== Step 2: Clear ALL Gradle caches (prevents stale compiled plugin) ==="
          rm -rf ~/.gradle/caches/
          rm -rf ~/.gradle/wrapper/
          rm -rf android/.gradle/
          rm -rf "$FLUTTER_SDK/packages/flutter_tools/gradle/build/" 2>/dev/null || true
          rm -rf "$FLUTTER_SDK/packages/flutter_tools/gradle/.gradle/" 2>/dev/null || true
          echo "All caches cleared."

          echo "=== Step 3: Patch afterEvaluate -> gradle.projectsEvaluated ==="
          MAIN_KT=$(find "$GRADLE_SRC" -name "*.kt" -not -path "*/test/*" | sort)
          echo "Files to check: $(echo "$MAIN_KT" | wc -l)"

          for f in $MAIN_KT; do
            before=$(grep -c "\.afterEvaluate {" "$f" 2>/dev/null || echo 0)
            if [ "$before" -gt "0" ]; then
              sed -i 's/\.afterEvaluate {/.gradle.projectsEvaluated {/g' "$f"
              after=$(grep -c "\.afterEvaluate {" "$f" 2>/dev/null || echo 0)
              echo "  PATCHED $(basename $f): $before -> $after afterEvaluate calls"
            fi
          done

          echo "=== Step 4: Verify patch success ==="
          REMAINING=$(grep -rn "\.afterEvaluate {" "$GRADLE_SRC" --include="*.kt" | grep -v "/test/" | wc -l)
          if [ "$REMAINING" -gt "0" ]; then
            echo "ERROR: $REMAINING afterEvaluate calls remain:"
            grep -rn "\.afterEvaluate {" "$GRADLE_SRC" --include="*.kt" | grep -v "/test/"
            exit 1
          fi
          echo "SUCCESS: 0 afterEvaluate calls remaining in Flutter Gradle plugin"

      - name: Get Flutter packages
        script: flutter pub get

      - name: Build APK release
        script: flutter build apk --release

      - name: Build AAB release
        script: flutter build appbundle --release

    artifacts:
      - build/app/outputs/apk/release/app-release.apk
      - build/app/outputs/bundle/release/app-release.aab

    publishing:
      email:
        recipients:
          - kouakouchristevann@gmail.com
        notify:
          success: true
          failure: true
