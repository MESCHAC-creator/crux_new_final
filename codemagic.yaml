workflows:
  android-release:
    name: Android Release - CRUX
    instance_type: linux
    max_build_duration: 120

    environment:
      flutter: master
      java: 17
      android_signing:
        - crux_keystore
      vars:
        CM_KEY_ALIAS: crux_key

    scripts:
      - name: Set up local.properties
        script: |
          FLUTTER_SDK=$(which flutter | xargs readlink -f | sed 's|/bin/flutter||')
          echo "flutter.sdk=$FLUTTER_SDK" > android/local.properties
          echo "Flutter SDK: $FLUTTER_SDK"
          flutter --version

      - name: Fix Flutter Gradle plugin for AGP 9 compatibility
        script: |
          FLUTTER_SDK=$(which flutter | xargs readlink -f | sed 's|/bin/flutter||')
          GRADLE_SRC="$FLUTTER_SDK/packages/flutter_tools/gradle/src/main/kotlin"

          echo "=== Reset any previous patches ==="
          git -C "$FLUTTER_SDK" checkout -- packages/flutter_tools/gradle/src/ 2>/dev/null \
            && echo "Reset OK" \
            || echo "git reset skipped"

          echo "=== Check for afterEvaluate calls ==="
          COUNT=$(grep -rn "\.afterEvaluate {" "$GRADLE_SRC" --include="*.kt" | grep -v "/test/" | wc -l)
          echo "Found $COUNT afterEvaluate call(s)"

          if [ "$COUNT" -eq "0" ]; then
            echo "No patch needed - Flutter SDK already uses projectsEvaluated"
          else
            echo "=== Applying safe patch ==="
            echo "" | base64 -d > /tmp/patch_flutter.py
            python3 /tmp/patch_flutter.py "$FLUTTER_SDK"
          fi

          echo "=== Clear compiled caches ==="
          rm -rf "$FLUTTER_SDK/packages/flutter_tools/gradle/build/"
          rm -rf "$FLUTTER_SDK/packages/flutter_tools/gradle/.gradle/"
          rm -rf ~/.gradle/caches/
          echo "Done"

      - name: Get Flutter packages
        script: flutter pub get

      - name: Build APK release
        script: flutter build apk --release

      - name: Build AAB release
        script: flutter build appbundle --release

    artifacts:
      - build/app/outputs/apk/release/app-release.apk
      - build/app/outputs/bundle/release/app-release.aab

    publishing:
      email:
        recipients:
          - kouakouchristevann@gmail.com
        notify:
          success: true
          failure: true
