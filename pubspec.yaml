name: crux
description: "APPLICATION DE VISIOCONFÉRENCE"
publish_to: 'none'

environment:
  sdk: '^3.12.0'

version: 1.0.0+1

dependencies:
  flutter:
    sdk: flutter

  # Firebase - VERSIONS LES PLUS RÉCENTES
  firebase_core: ^4.9.0
  firebase_auth: ^6.5.1
  cloud_firestore: ^6.4.1
  firebase_storage: ^13.4.1
  firebase_analytics: ^12.4.1

  # Agora - VIDEO CONFERENCING
  agora_rtc_engine: ^6.6.3

  # Permissions & Localization
  permission_handler: ^11.4.0
  intl: ^0.20.2
  flutter_localizations:
    sdk: flutter

  # State & Storage
  provider: ^6.1.2
  shared_preferences: ^2.2.3

  # HTTP & Utilities
  http: ^1.2.2
  uuid: ^4.2.1
  logger: ^2.1.0

  # Firebase Messaging
  firebase_messaging: ^13.0.0

  # UI & Animation
  google_fonts: ^6.2.1

  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/poppins-regular.ttf
          weight: 400
        - asset: assets/fonts/poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/poppins-bold.ttf
          weight: 700