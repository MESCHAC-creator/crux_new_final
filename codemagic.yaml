workflows:
  android-release:
    name: Android Release - CRUX
    instance_type: linux
    max_build_duration: 120

    environment:
      flutter: stable
      java: 17
      android_signing:
        - crux_keystore
      vars:
        CM_KEY_ALIAS: crux_key

    scripts:
      - name: Set up local.properties
        script: |
          echo "flutter.sdk=$HOME/sdks/flutter" > android/local.properties

      - name: Patch Flutter Gradle plugin and clear Gradle cache
        script: |
          GRADLE_SRC="$HOME/sdks/flutter/packages/flutter_tools/gradle/src/main/kotlin"

          echo "=== Patching Flutter Gradle plugin source ==="
          find "$GRADLE_SRC" -name "*.kt" -print | while read f; do
            before=$(grep -c "afterEvaluate" "$f" 2>/dev/null || echo 0)
            sed -i 's/\.afterEvaluate {/.gradle.projectsEvaluated {/g' "$f"
            after=$(grep -c "afterEvaluate" "$f" 2>/dev/null || echo 0)
            if [ "$before" != "$after" ]; then
              echo "Patched: $f (was $before, now $after)"
            fi
          done

          echo "=== Remaining afterEvaluate calls ==="
          grep -rn "afterEvaluate" "$GRADLE_SRC" --include="*.kt" || echo "None - patch successful"

          echo "=== Clearing Gradle cache to force recompilation ==="
          rm -rf ~/.gradle/caches/
          rm -rf ~/.gradle/wrapper/dists/
          echo "Cache cleared"

      - name: Get Flutter packages
        script: flutter pub get

      - name: Build APK release
        script: flutter build apk --release

      - name: Build AAB release
        script: flutter build appbundle --release

    artifacts:
      - build/app/outputs/apk/release/app-release.apk
      - build/app/outputs/bundle/release/app-release.aab

    publishing:
      email:
        recipients:
          - kouakouchristevann@gmail.com
        notify:
          success: true
          failure: true
