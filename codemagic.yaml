workflows:

  # ═══════════════════════════════════════════════════════
  #  ANDROID RELEASE
  # ═══════════════════════════════════════════════════════
  android-release:
    name: Android Release - CRUX
    instance_type: linux
    max_build_duration: 120

    environment:
      flutter: 3.29.2
      java: 17
      groups:
        - firebase_deploy

    scripts:
      - name: Set up local.properties
        script: |
          # Resolve Flutter SDK root robustly from the flutter binary in PATH
          FLUTTER_BIN=$(command -v flutter)
          FLUTTER_SDK=$(dirname "$(dirname "$FLUTTER_BIN")")
          echo "flutter.sdk=$FLUTTER_SDK" > android/local.properties
          # Also expose Android SDK path so Gradle can find it
          if [ -n "$ANDROID_SDK_ROOT" ]; then
            echo "sdk.dir=$ANDROID_SDK_ROOT" >> android/local.properties
          elif [ -n "$ANDROID_HOME" ]; then
            echo "sdk.dir=$ANDROID_HOME" >> android/local.properties
          fi
          echo "✅ local.properties:"
          cat android/local.properties
          flutter --version

      - name: Clean Gradle cache
        script: |
          rm -rf ~/.gradle/caches/ || true
          rm -rf ~/.gradle/wrapper/dists/ || true
          cd android && ./gradlew clean --no-daemon || true
          echo "✅ Gradle cache nettoyé"

      - name: Get Flutter packages
        script: |
          rm -f pubspec.lock
          flutter pub get

      - name: Deploy Firestore rules (if FIREBASE_TOKEN is set)
        script: |
          if [ -n "$FIREBASE_TOKEN" ]; then
            npm install -g firebase-tools --silent
            firebase deploy --only firestore:rules \
              --project crux-8aa85 \
              --token "$FIREBASE_TOKEN" \
              --non-interactive
            echo "✅ Règles Firestore déployées"
          else
            echo "⏭️  FIREBASE_TOKEN absent — build OK"
          fi

      - name: Patch flutter_webrtc (remove V1 embedding)
        script: |
          python3 - <<'PYEOF'
          import re, glob, os

          pattern = os.path.expanduser(
              '~/.pub-cache/hosted/pub.dev/flutter_webrtc*/android/src/main/java/com/cloudwebrtc/webrtc/FlutterWebRTCPlugin.java'
          )
          files = glob.glob(pattern)
          if not files:
              print('flutter_webrtc plugin not found, skipping patch')
              exit(0)

          for path in files:
              with open(path, 'r') as f:
                  content = f.read()
              original = content
              # Remove V1 Registrar import line
              content = re.sub(
                  r'import io\.flutter\.plugin\.common\.PluginRegistry\.Registrar;\n',
                  '',
                  content
              )
              # Remove V1 registerWith method (short body, no nested braces)
              content = re.sub(
                  r'\n[ \t]+public static void registerWith\(Registrar[^)]*\) \{[^}]*\}',
                  '',
                  content
              )
              if content != original:
                  with open(path, 'w') as f:
                      f.write(content)
                  print(f'Patched: {path}')
              else:
                  print(f'No changes needed: {path}')
          PYEOF

      - name: Generate app icons
        script: dart run flutter_launcher_icons -f flutter_launcher_icons_android.yaml

      - name: Build APK and AAB
        script: |
          set -e
          mkdir -p build/outputs

          # Helper: find an APK/AAB anywhere in the build tree after Gradle runs
          find_apk() {
            find build/app/outputs/flutter-apk -name "app-release.apk" 2>/dev/null | head -1
            find build/app/outputs/apk         -name "app-release.apk" 2>/dev/null | head -1
            find build/app/outputs             -name "*.apk" ! -path "*/debug/*" 2>/dev/null | head -1
          }
          find_aab() {
            find build/app/outputs/bundle -name "app-release.aab" 2>/dev/null | head -1
            find build/app/outputs        -name "*.aab"            2>/dev/null | head -1
          }

          # ── APK ──────────────────────────────────────────────────────────────
          set +e
          flutter build apk --release --no-tree-shake-icons
          APK_EXIT=$?
          set -e

          APK=$(find_apk | head -1)

          if [ -z "$APK" ]; then
            echo "⚠️  flutter build apk (exit $APK_EXIT) did not place APK in expected dirs."
            echo "    Listing build/app/outputs:"
            find build/app/outputs 2>/dev/null || echo "    (empty)"
            echo "    Retrying via Gradle directly..."
            cd android
            ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tail -40
            cd ..
            APK=$(find build/app/outputs -name "*.apk" ! -path "*/debug/*" 2>/dev/null | head -1)
          fi

          if [ -z "$APK" ]; then
            echo "❌ APK not found after Gradle retry."
            exit 1
          fi
          cp "$APK" build/outputs/crux-release.apk
          echo "✅ APK: $(du -sh build/outputs/crux-release.apk | cut -f1) — from $APK"

          # ── AAB ──────────────────────────────────────────────────────────────
          set +e
          flutter build appbundle --release --no-tree-shake-icons
          AAB_EXIT=$?
          set -e

          AAB=$(find_aab | head -1)

          if [ -z "$AAB" ]; then
            echo "⚠️  flutter build appbundle (exit $AAB_EXIT) did not place AAB in expected dirs."
            echo "    Retrying via Gradle directly..."
            cd android
            ./gradlew bundleRelease --no-daemon 2>&1 | tail -20
            cd ..
            AAB=$(find build/app/outputs -name "*.aab" 2>/dev/null | head -1)
          fi

          if [ -z "$AAB" ]; then
            echo "❌ AAB not found after Gradle retry."
            exit 1
          fi
          cp "$AAB" build/outputs/crux-release.aab
          echo "✅ AAB: $(du -sh build/outputs/crux-release.aab | cut -f1) — from $AAB"

    artifacts:
      - build/outputs/crux-release.apk
      - build/outputs/crux-release.aab

    publishing:
      email:
        recipients:
          - kouakouchristevann@gmail.com
        notify:
          success: true
          failure: true

  # ═══════════════════════════════════════════════════════
  #  iOS RELEASE
  # ═══════════════════════════════════════════════════════
  ios-release:
    name: iOS Release - CRUX
    instance_type: mac_mini_m2
    max_build_duration: 120

    integrations:
      app_store_connect: codemagic_api_key

    environment:
      flutter: 3.29.2
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.example.crux
      groups:
        - firebase_ios
        - firebase_deploy

    scripts:
      - name: Generate iOS project files
        script: |
          set -e
          if [ ! -d "ios" ]; then
            flutter create --platforms ios --org com.example --project-name crux .
            echo "✅ iOS folder generated"
          else
            echo "✅ iOS folder already exists"
          fi
          PBXPROJ="ios/Runner.xcodeproj/project.pbxproj"
          if [ -f "$PBXPROJ" ]; then
            sed -i '' 's/PRODUCT_BUNDLE_IDENTIFIER = [^;]*/PRODUCT_BUNDLE_IDENTIFIER = com.example.crux/g' "$PBXPROJ" || \
            sed -i 's/PRODUCT_BUNDLE_IDENTIFIER = [^;]*/PRODUCT_BUNDLE_IDENTIFIER = com.example.crux/g' "$PBXPROJ"
            echo "✅ Bundle ID patché"
          fi

      - name: Inject GoogleService-Info.plist
        script: |
          if [ -n "$GOOGLE_SERVICE_INFO_PLIST" ]; then
            echo "$GOOGLE_SERVICE_INFO_PLIST" | base64 --decode > ios/Runner/GoogleService-Info.plist
            echo "✅ GoogleService-Info.plist injecté"
          else
            echo "⚠️  GOOGLE_SERVICE_INFO_PLIST absent — Firebase iOS désactivé"
          fi

      - name: Patch Info.plist permissions
        script: |
          set -e
          PLIST="ios/Runner/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string 'CRUX needs the camera for video conferences'" "$PLIST" 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Set :NSCameraUsageDescription 'CRUX needs the camera for video conferences'" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :NSMicrophoneUsageDescription string 'CRUX needs the microphone for calls'" "$PLIST" 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Set :NSMicrophoneUsageDescription 'CRUX needs the microphone for calls'" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string 'CRUX'" "$PLIST" 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName 'CRUX'" "$PLIST"
          echo "✅ Info.plist patché"

      - name: Get Flutter packages
        script: flutter pub get

      - name: Deploy Firestore rules (if FIREBASE_TOKEN is set)
        script: |
          if [ -n "$FIREBASE_TOKEN" ]; then
            npm install -g firebase-tools --silent
            firebase deploy --only firestore:rules \
              --project crux-8aa85 \
              --token "$FIREBASE_TOKEN" \
              --non-interactive
            echo "✅ Règles Firestore déployées"
          else
            echo "⏭️  FIREBASE_TOKEN absent — build OK"
          fi

      - name: Generate app icons
        script: dart run flutter_launcher_icons -f flutter_launcher_icons_ios.yaml

      - name: Install CocoaPods
        script: |
          set -e
          cd ios
          pod repo update
          pod install
          echo "✅ CocoaPods installé"

      - name: Build iOS IPA
        script: |
          set -e
          flutter build ipa --release \
            --export-options-plist=/Users/builder/export_options.plist
          echo "✅ IPA buildé"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      email:
        recipients:
          - kouakouchristevann@gmail.com
        notify:
          success: true
          failure: true
      app_store_connect:
        auth: integration
        submit_to_testflight: true
