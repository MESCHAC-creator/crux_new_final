workflows:
  android-release:
    name: Android Release - CRUX
    instance_type: linux
    max_build_duration: 120

    environment:
      flutter: stable
      java: 17

    scripts:
      - name: Set up local.properties
        script: |
          FLUTTER_SDK=$(which flutter | xargs readlink -f | sed 's|/bin/flutter||')
          echo "flutter.sdk=$FLUTTER_SDK" > android/local.properties
          echo "Flutter SDK path: $FLUTTER_SDK"
          flutter --version

      - name: Patch Flutter Gradle plugin (afterEvaluate timing fix)
        script: |
          FLUTTER_SDK=$(which flutter | xargs readlink -f | sed 's|/bin/flutter||')
          GRADLE_SRC="$FLUTTER_SDK/packages/flutter_tools/gradle/src/main/kotlin"

          python3 - "$FLUTTER_SDK" << 'PYEOF'
import re, sys, glob, os

flutter_sdk = sys.argv[1]
gradle_src = os.path.join(flutter_sdk, "packages/flutter_tools/gradle/src/main/kotlin")

def patch_file(filepath):
    with open(filepath) as f:
        content = f.read()
    # Replace: foo.afterEvaluate { BODY }
    # With:    if (foo.state.executed) { BODY } else { foo.afterEvaluate { BODY } }
    pattern = re.compile(r'(\b\w+)\.afterEvaluate\s*\{')
    if not pattern.search(content):
        return False
    result = []
    i = 0
    while i < len(content):
        m = pattern.search(content, i)
        if not m:
            result.append(content[i:])
            break
        result.append(content[i:m.start()])
        varname = m.group(1)
        # find matching brace
        depth = 1
        j = m.end()
        while j < len(content) and depth > 0:
            c = content[j]
            if c == '{': depth += 1
            elif c == '}': depth -= 1
            j += 1
        body = content[m.end():j-1]
        replacement = (
            'if (' + varname + '.state.executed) {\n' + body + '\n} else {\n'
            + varname + '.afterEvaluate {\n' + body + '\n}\n}'
        )
        result.append(replacement)
        i = j
    new_content = ''.join(result)
    if new_content != content:
        with open(filepath, 'w') as f:
            f.write(new_content)
        print('PATCHED: ' + os.path.basename(filepath))
        return True
    return False

patched = 0
for f in sorted(glob.glob(gradle_src + '/**/*.kt', recursive=True)):
    if '/test/' not in f and patch_file(f):
        patched += 1
print('Files patched: ' + str(patched))
PYEOF

          # Clear compiled Gradle plugin cache so patch takes effect
          rm -rf "$FLUTTER_SDK/packages/flutter_tools/gradle/build/" 2>/dev/null || true
          rm -rf "$FLUTTER_SDK/packages/flutter_tools/gradle/.gradle/" 2>/dev/null || true
          echo "Patch complete"

      - name: Get Flutter packages
        script: flutter pub get

      - name: Generate app icons
        script: dart run flutter_launcher_icons

      - name: Build APK and AAB
        script: |
          set -e
          mkdir -p build/outputs

          # --- APK ---
          flutter build apk --release --android-skip-build-dependency-validation || true

          echo "=== APK search ==="
          find . -type f -name "*.apk" 2>/dev/null | grep -v ".pub-cache" || echo "(none)"

          APK=$(find . -type f -name "*.apk" ! -name "*unsigned*" 2>/dev/null | grep -v ".pub-cache" | head -1)

          if [ -n "$APK" ]; then
            cp "$APK" build/outputs/crux-release.apk
            echo "✅ APK: $APK → build/outputs/crux-release.apk ($(du -sh "$APK" | cut -f1))"
          else
            echo "❌ No APK found."
            exit 1
          fi

          # --- AAB ---
          flutter build appbundle --release --android-skip-build-dependency-validation || true

          AAB=$(find . -type f -name "*.aab" 2>/dev/null | grep -v ".pub-cache" | head -1)
          if [ -n "$AAB" ]; then
            cp "$AAB" build/outputs/crux-release.aab
            echo "✅ AAB: $AAB → build/outputs/crux-release.aab ($(du -sh "$AAB" | cut -f1))"
          fi

    artifacts:
      - build/outputs/crux-release.apk
      - build/outputs/crux-release.aab

    publishing:
      email:
        recipients:
          - kouakouchristevann@gmail.com
        notify:
          success: true
          failure: true
