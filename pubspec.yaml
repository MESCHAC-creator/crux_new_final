name: crux
description: "APPLICATION DE VISIOCONFÉRENCE"
publish_to: 'none'

environment:
  sdk: '>=3.0.0 <4.0.0'

version: 1.0.0+1

dependencies:
  flutter:
    sdk: flutter

  # Firebase - VERSIONS LES PLUS RÉCENTES
  firebase_core: ^4.9.0
  firebase_auth: ^6.5.1
  cloud_firestore: ^6.4.1
  firebase_storage: ^13.4.1
  firebase_analytics: ^12.4.1

  # Jitsi Meet - VIDEO CONFERENCING (free, open-source, no compile issues)
  jitsi_meet_flutter_sdk: ^10.2.0

  # Permissions & Localization
  permission_handler: ^12.0.0
  intl: ^0.20.2
  flutter_localizations:
    sdk: flutter

  # State & Storage
  provider: ^6.1.2
  shared_preferences: ^2.2.3

  # HTTP & Utilities
  http: ^1.2.2
  dio: ^5.4.0
  uuid: ^4.2.1
  logger: ^2.1.0

  # Firebase Messaging
  firebase_messaging: ^16.2.2

  # UI & Animation
  google_fonts: ^8.1.0

  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.0

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/logo.png"
  min_sdk_android: 24
  adaptive_icon_background: "#1565C0"
  adaptive_icon_foreground: "assets/images/logo.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/animation/
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/poppins-regular.ttf
          weight: 400
        - asset: assets/fonts/poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/poppins-bold.ttf
          weight: 700