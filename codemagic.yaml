workflows:

  # ═══════════════════════════════════════════════════════
  #  ANDROID RELEASE
  # ═══════════════════════════════════════════════════════
  android-release:
    name: Android Release - CRUX
    instance_type: linux
    max_build_duration: 120

    environment:
      flutter: 3.24.5
      java: 17
      groups:
        - firebase_deploy   # contient FIREBASE_TOKEN (optionnel - déploie les règles Firestore)

    scripts:
      - name: Set up local.properties
        script: |
          FLUTTER_SDK=$(which flutter | xargs readlink -f | sed 's|/bin/flutter||')
          echo "flutter.sdk=$FLUTTER_SDK" > android/local.properties
          flutter --version

      - name: Get Flutter packages
        script: flutter pub get

      - name: Configure AGP 8.1.4 + Gradle properties
        script: |
          set -e
          # Lock to AGP 8.1.4 — this version does NOT have the afterEvaluate restriction
          # No Python patch needed at all
          sed -i 's/id("com.android.application") version "[^"]*"/id("com.android.application") version "8.1.4"/' android/settings.gradle.kts
          sed -i 's/id("com.android.library") version "[^"]*"/id("com.android.library") version "8.1.4"/' android/settings.gradle.kts
          # Use Gradle 8.4 (compatible with AGP 8.1.4)
          sed -i 's|gradle-[0-9.]*-bin.zip|gradle-8.4-bin.zip|' android/gradle/wrapper/gradle-wrapper.properties
          # Required Gradle property for Flutter 3.24.x
          grep -q "^android.newDsl=false" android/gradle.properties || echo "android.newDsl=false" >> android/gradle.properties
          echo "✅ AGP 8.1.4 + Gradle 8.4 configurés"

      - name: Deploy Firestore rules (if FIREBASE_TOKEN is set)
        script: |
          if [ -n "$FIREBASE_TOKEN" ]; then
            npm install -g firebase-tools --silent
            firebase deploy --only firestore:rules \
              --project crux-8aa85 \
              --token "$FIREBASE_TOKEN" \
              --non-interactive
            echo "✅ Règles Firestore déployées"
          else
            echo "⏭️  FIREBASE_TOKEN non défini — règles non déployées (OK pour le build)"
          fi

      - name: Generate app icons
        script: dart run flutter_launcher_icons -f flutter_launcher_icons_android.yaml

      - name: Build APK and AAB
        script: |
          set -e
          mkdir -p build/outputs
          flutter build apk --release --android-skip-build-dependency-validation
          echo "=== APK search ==="
          find . -type f -name "*.apk" 2>/dev/null | grep -v ".pub-cache" || echo "(none)"
          APK=$(find . -type f -name "*.apk" ! -name "*unsigned*" 2>/dev/null | grep -v ".pub-cache" | head -1)
          if [ -n "$APK" ]; then
            cp "$APK" build/outputs/crux-release.apk
            echo "✅ APK: $APK ($(du -sh "$APK" | cut -f1))"
          else
            echo "❌ No APK found."; exit 1
          fi
          flutter build appbundle --release --android-skip-build-dependency-validation
          AAB=$(find . -type f -name "*.aab" 2>/dev/null | grep -v ".pub-cache" | head -1)
          if [ -n "$AAB" ]; then
            cp "$AAB" build/outputs/crux-release.aab
            echo "✅ AAB: $AAB ($(du -sh "$AAB" | cut -f1))"
          else
            echo "❌ No AAB found."; exit 1
          fi

    artifacts:
      - build/outputs/crux-release.apk
      - build/outputs/crux-release.aab

    publishing:
      email:
        recipients:
          - kouakouchristevann@gmail.com
        notify:
          success: true
          failure: true

  # ═══════════════════════════════════════════════════════
  #  iOS RELEASE
  # ═══════════════════════════════════════════════════════
  ios-release:
    name: iOS Release - CRUX
    instance_type: mac_mini_m2
    max_build_duration: 120

    integrations:
      app_store_connect: codemagic_api_key

    environment:
      flutter: 3.24.5
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.example.crux
      groups:
        - firebase_ios
        - firebase_deploy

    scripts:
      - name: Generate iOS project files
        script: |
          if [ ! -d "ios" ]; then
            flutter create --platforms ios --org com.example --project-name crux .
            echo "✅ iOS folder generated"
          else
            echo "✅ iOS folder already exists"
          fi

      - name: Inject GoogleService-Info.plist
        script: |
          if [ -n "$GOOGLE_SERVICE_INFO_PLIST" ]; then
            echo "$GOOGLE_SERVICE_INFO_PLIST" | base64 --decode > ios/Runner/GoogleService-Info.plist
            echo "✅ GoogleService-Info.plist injecté"
          else
            echo "⚠️  GOOGLE_SERVICE_INFO_PLIST non défini — Firebase iOS peut échouer"
          fi

      - name: Patch Info.plist permissions
        script: |
          PLIST="ios/Runner/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string 'CRUX a besoin de la caméra pour les vidéoconférences'" "$PLIST" 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Set :NSCameraUsageDescription 'CRUX a besoin de la caméra pour les vidéoconférences'" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :NSMicrophoneUsageDescription string 'CRUX a besoin du microphone pour les appels'" "$PLIST" 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Set :NSMicrophoneUsageDescription 'CRUX a besoin du microphone pour les appels'" "$PLIST"
          echo "✅ Info.plist patché"

      - name: Get Flutter packages
        script: flutter pub get

      - name: Deploy Firestore rules (if FIREBASE_TOKEN is set)
        script: |
          if [ -n "$FIREBASE_TOKEN" ]; then
            npm install -g firebase-tools --silent
            firebase deploy --only firestore:rules \
              --project crux-8aa85 \
              --token "$FIREBASE_TOKEN" \
              --non-interactive
            echo "✅ Règles Firestore déployées"
          else
            echo "⏭️  FIREBASE_TOKEN non défini — règles non déployées (OK pour le build)"
          fi

      - name: Generate app icons
        script: dart run flutter_launcher_icons -f flutter_launcher_icons_ios.yaml

      - name: Install CocoaPods
        script: |
          cd ios && pod install --repo-update
          echo "✅ CocoaPods installé"

      - name: Build iOS IPA
        script: |
          flutter build ipa --release \
            --export-options-plist=/Users/builder/export_options.plist \
            || flutter build ipa --release
          echo "✅ IPA buildé"

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      email:
        recipients:
          - kouakouchristevann@gmail.com
        notify:
          success: true
          failure: true
      app_store_connect:
        auth: integration
        submit_to_testflight: true
