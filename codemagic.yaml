workflows:
  android-release:
    name: Android Release - CRUX
    instance_type: linux
    max_build_duration: 120

    environment:
      flutter: stable
      java: 17

    scripts:
      - name: Set up local.properties
        script: |
          FLUTTER_SDK=$(which flutter | xargs readlink -f | sed 's|/bin/flutter||')
          echo "flutter.sdk=$FLUTTER_SDK" > android/local.properties
          echo "Flutter SDK path: $FLUTTER_SDK"
          flutter --version

      - name: Patch Flutter Gradle plugin (afterEvaluate -> state.executed guard)
        script: |
          FLUTTER_SDK=$(which flutter | xargs readlink -f | sed 's|/bin/flutter||')
          GRADLE_SRC="$FLUTTER_SDK/packages/flutter_tools/gradle/src/main/kotlin"

          echo "=== Scanning for afterEvaluate calls ==="
          COUNT=$(grep -rn "afterEvaluate" "$GRADLE_SRC" --include="*.kt" 2>/dev/null | grep -v "/test/" | wc -l || echo 0)
          echo "afterEvaluate occurrences: $COUNT"

          echo '' | base64 -d > /tmp/patch_flutter.py
          python3 /tmp/patch_flutter.py "$FLUTTER_SDK"

          echo "=== Clearing compiled Gradle caches ==="
          rm -rf "$FLUTTER_SDK/packages/flutter_tools/gradle/build/" 2>/dev/null || true
          rm -rf "$FLUTTER_SDK/packages/flutter_tools/gradle/.gradle/" 2>/dev/null || true
          rm -rf ~/.gradle/caches/ 2>/dev/null || true
          echo "Done"

      - name: Get Flutter packages
        script: flutter pub get

      - name: Generate app icons
        script: dart run flutter_launcher_icons

      - name: Build APK release
        script: |
          set -e

          # Step 1: compile Dart → kernel + assets (no Gradle)
          flutter build apk --release --android-skip-build-dependency-validation || true

          # Step 2: the Flutter CLI may lie about failure; find APK wherever Gradle put it
          DEST="build/outputs/crux-release.apk"
          mkdir -p build/outputs

          APK_PATH=$(find build/app/outputs -name "*.apk" ! -name "*unsigned*" -printf '%T@ %p\n' 2>/dev/null \
                     | sort -rn | head -1 | awk '{print $2}')

          if [ -z "$APK_PATH" ]; then
            # last-resort: full tree search
            APK_PATH=$(find build -name "*.apk" ! -name "*unsigned*" 2>/dev/null | head -1)
          fi

          if [ -n "$APK_PATH" ]; then
            cp "$APK_PATH" "$DEST"
            echo "✅ APK found at: $APK_PATH"
            echo "✅ Copied to:    $DEST"
            ls -lh "$DEST"
          else
            echo "❌ No APK produced. Gradle output tree:"
            find build -name "*.apk" 2>/dev/null || echo "(none)"
            exit 1
          fi

      - name: Build AAB release
        script: |
          set -e

          flutter build appbundle --release --android-skip-build-dependency-validation || true

          DEST="build/outputs/crux-release.aab"
          mkdir -p build/outputs

          AAB_PATH=$(find build/app/outputs -name "*.aab" -printf '%T@ %p\n' 2>/dev/null \
                     | sort -rn | head -1 | awk '{print $2}')

          if [ -z "$AAB_PATH" ]; then
            AAB_PATH=$(find build -name "*.aab" 2>/dev/null | head -1)
          fi

          if [ -n "$AAB_PATH" ]; then
            cp "$AAB_PATH" "$DEST"
            echo "✅ AAB found at: $AAB_PATH"
            echo "✅ Copied to:    $DEST"
            ls -lh "$DEST"
          else
            echo "❌ No AAB produced. Gradle output tree:"
            find build -name "*.aab" 2>/dev/null || echo "(none)"
            exit 1
          fi

    artifacts:
      - build/outputs/crux-release.apk
      - build/outputs/crux-release.aab

    publishing:
      email:
        recipients:
          - kouakouchristevann@gmail.com
        notify:
          success: true
          failure: true
