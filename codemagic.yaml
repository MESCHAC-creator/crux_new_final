workflows:
  android-release:
    name: Android Release - CRUX

    instance_type: linux_x2

    max_build_duration: 120

    environment:
      flutter: 3.27.0
      java: 17

      groups:
        - firebase_credentials

      vars:
        LIVEKIT_WSS_URL: "wss://crux-88fihb12.livekit.cloud"
        LIVEKIT_TOKEN_SERVER_URL: "https://crux-6l6num.sandbox.livekit.io"

        FIREBASE_PROJECT_ID: "crux-3c6be"

        APP_BASE_URL: "https://crux-3c6be.web.app"

    cache:
      cache_paths:
        - $FLUTTER_ROOT/.pub-cache
        - $HOME/.gradle/caches

    scripts:

      # ═══════════════════════════════════════════════════════════════
      # SETUP
      # ═══════════════════════════════════════════════════════════════

      - name: Flutter setup
        script: |
          flutter --version
          flutter clean
          flutter pub get

      # ═══════════════════════════════════════════════════════════════
      # LOCAL PROPERTIES
      # ═══════════════════════════════════════════════════════════════

      - name: Configure Android local.properties
        script: |
          FLUTTER_PATH="$(dirname "$(dirname "$(which flutter)")")"

          echo "flutter.sdk=$FLUTTER_PATH" > android/local.properties

          echo "===== android/local.properties ====="
          cat android/local.properties

      # ═══════════════════════════════════════════════════════════════
      # SIGNING
      # ═══════════════════════════════════════════════════════════════

      - name: Configure Android signing
        script: |
          echo "storePassword=$CM_KEYSTORE_PASSWORD" > android/key.properties
          echo "keyPassword=$CM_KEY_PASSWORD" >> android/key.properties
          echo "keyAlias=$CM_KEY_ALIAS" >> android/key.properties
          echo "storeFile=$CM_KEYSTORE_PATH" >> android/key.properties

          echo "Android signing configured."

      # ═══════════════════════════════════════════════════════════════
      # ANALYZE
      # ═══════════════════════════════════════════════════════════════

      - name: Analyze Flutter project
        script: |
          flutter analyze --fatal-infos

      # ═══════════════════════════════════════════════════════════════
      # BUILD APK
      # ═══════════════════════════════════════════════════════════════

      - name: Build Android APK
        script: |
          flutter build apk \
            --release \
            --target-platform android-arm64 \
            --build-name=2.38.1 \
            --build-number=240 \
            --dart-define=LIVEKIT_WSS_URL="$LIVEKIT_WSS_URL" \
            --dart-define=LIVEKIT_TOKEN_SERVER_URL="$LIVEKIT_TOKEN_SERVER_URL" \
            --dart-define=FIREBASE_PROJECT_ID="$FIREBASE_PROJECT_ID" \
            --dart-define=APP_BASE_URL="$APP_BASE_URL"

      # ═══════════════════════════════════════════════════════════════
      # BUILD AAB
      # ═══════════════════════════════════════════════════════════════

      - name: Build Android App Bundle
        script: |
          flutter build appbundle \
            --release \
            --build-name=2.38.1 \
            --build-number=240 \
            --dart-define=LIVEKIT_WSS_URL="$LIVEKIT_WSS_URL" \
            --dart-define=LIVEKIT_TOKEN_SERVER_URL="$LIVEKIT_TOKEN_SERVER_URL" \
            --dart-define=FIREBASE_PROJECT_ID="$FIREBASE_PROJECT_ID" \
            --dart-define=APP_BASE_URL="$APP_BASE_URL"

      # ═══════════════════════════════════════════════════════════════
      # COPY ARTIFACTS
      # ═══════════════════════════════════════════════════════════════

      - name: Prepare release artifacts
        script: |
          mkdir -p build/outputs

          cp \
            build/app/outputs/flutter-apk/app-release.apk \
            build/outputs/crux-release.apk

          cp \
            build/app/outputs/bundle/release/app-release.aab \
            build/outputs/crux-release.aab

          ls -lh build/outputs/

    # ═══════════════════════════════════════════════════════════════════
    # ARTIFACTS
    # ═══════════════════════════════════════════════════════════════════

    artifacts:
      - build/outputs/crux-release.apk
      - build/outputs/crux-release.aab

    # ═══════════════════════════════════════════════════════════════════
    # EMAIL
    # ═══════════════════════════════════════════════════════════════════

    publishing:
      email:
        recipients:
          - kouakouchristevann@gmail.com

        notify:
          success: true
          failure: true
