flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#0A0A0F"
  # By omitting adaptive_icon_foreground here, the tool will try to use the image_path.
  # If we want it to fill more space, we use a separate foreground.
  # Let's use the image as the foreground but ensure it's not double-padded.
  adaptive_icon_foreground: "assets/images/icon.png"
