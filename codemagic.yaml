workflows:
  android-release:
    name: Android Release - CRUX
    instance_type: linux_x2
    max_build_duration: 120

    environment:
      flutter: 3.27.0
      java: 17

      groups:
        - firebase_credentials

      vars:
        FIREBASE_PROJECT_ID: "crux-3c6be"
        APP_BASE_URL: "https://crux-3c6be.web.app"

    cache:
      cache_paths:
        - $FLUTTER_ROOT/.pub-cache
        - $HOME/.gradle/caches

    scripts:

      - name: Clean and get dependencies
        script: |
          flutter clean
          flutter pub get
          flutter --version

      - name: Set up local.properties
        script: |
          FLUTTER_SDK=$(dirname $(dirname $(readlink -f $(which flutter))))
          echo "flutter.sdk=$FLUTTER_SDK" > android/local.properties

          echo "Generated android/local.properties:"
          cat android/local.properties

      - name: Set up key.properties
        script: |
          echo "storePassword=$CM_KEYSTORE_PASSWORD" > android/key.properties
          echo "keyPassword=$CM_KEY_PASSWORD" >> android/key.properties
          echo "keyAlias=$CM_KEY_ALIAS" >> android/key.properties
          echo "storeFile=$CM_KEYSTORE_PATH" >> android/key.properties

      - name: Analyze Flutter project
        script: |
          flutter analyze --fatal-infos || true

      - name: Verify Flutter dependencies
        script: |
          flutter pub deps

      - name: Build APK
        script: |
          flutter build apk \
            --release \
            --target-platform android-arm64 \
            --build-name=2.38.1 \
            --build-number=4 \
            --dart-define=FIREBASE_PROJECT_ID="$FIREBASE_PROJECT_ID" \
            --dart-define=APP_BASE_URL="$APP_BASE_URL"

      - name: Build AAB
        script: |
          flutter build appbundle \
            --release \
            --build-name=2.38.1 \
            --build-number=4 \
            --dart-define=FIREBASE_PROJECT_ID="$FIREBASE_PROJECT_ID" \
            --dart-define=APP_BASE_URL="$APP_BASE_URL"

      - name: Copy artifacts
        script: |
          mkdir -p build/outputs

          cp \
            build/app/outputs/flutter-apk/app-release.apk \
            build/outputs/crux-release.apk

          cp \
            build/app/outputs/bundle/release/app-release.aab \
            build/outputs/crux-release.aab

          ls -lh build/outputs/

    artifacts:
      - build/outputs/crux-release.apk
      - build/outputs/crux-release.aab

    publishing:
      email:
        recipients:
          - kouakouchristevann@gmail.com

        notify:
          success: true
          failure: true
