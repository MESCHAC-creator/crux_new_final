workflows:
  android-release:
    name: Android Release - CRUX
    instance_type: linux_x2
    max_build_duration: 120

    environment:
      flutter: 3.27.0
      java: 17

      groups:
        - firebase_credentials

      vars:
        LIVEKIT_WSS_URL: "wss://crux-88fihb12.livekit.cloud"
        LIVEKIT_TOKEN_SERVER_URL: "https://crux-6l6num.sandbox.livekit.io"
        FIREBASE_PROJECT_ID: "crux-3c6be"
        APP_BASE_URL: "https://crux-3c6be.web.app"

    cache:
      cache_paths:
        - $FLUTTER_ROOT/.pub-cache
        - $HOME/.gradle/caches

    scripts:

      # ──────────────────────────────────────────────────────────────────
      # 1. Nettoyage et récupération des dépendances
      # ──────────────────────────────────────────────────────────────────
      - name: Clean and setup
        script: |
          set -e

          flutter --version

          flutter clean

          rm -rf .dart_tool

          flutter pub get

          flutter pub deps | grep -E "flutter_webrtc|livekit_client|provider|flutter_local_notifications|image_picker|cloud_functions" || true

      # ──────────────────────────────────────────────────────────────────
      # 2. Configuration Android
      # ──────────────────────────────────────────────────────────────────
      - name: Set up Android
        script: |
          set -e

          flutter config --android-sdk "$ANDROID_SDK_ROOT"

          if [ ! -f android/local.properties ]; then
            FLUTTER_SDK=$(which flutter | xargs readlink -f | sed 's|/bin/flutter||')
            echo "flutter.sdk=$FLUTTER_SDK" > android/local.properties
          fi

          echo "Android SDK: $ANDROID_SDK_ROOT"
          echo "Flutter SDK: $(which flutter)"

      # ──────────────────────────────────────────────────────────────────
      # 3. Configuration de la signature Android
      # ──────────────────────────────────────────────────────────────────
      - name: Set up key.properties
        script: |
          set -e

          echo "storePassword=$CM_KEYSTORE_PASSWORD" > android/key.properties
          echo "keyPassword=$CM_KEY_PASSWORD" >> android/key.properties
          echo "keyAlias=$CM_KEY_ALIAS" >> android/key.properties
          echo "storeFile=$CM_KEYSTORE_PATH" >> android/key.properties

      # ──────────────────────────────────────────────────────────────────
      # 4. Analyse
      # ──────────────────────────────────────────────────────────────────
      - name: Analyze code
        script: |
          flutter analyze --fatal-infos || true

      # ──────────────────────────────────────────────────────────────────
      # 5. Build APK
      # ──────────────────────────────────────────────────────────────────
      - name: Build APK
        script: |
          set -e

          flutter build apk --release \
            --target-platform android-arm64 \
            --build-name=2.38.1 \
            --build-number=4 \
            --dart-define=LIVEKIT_WSS_URL="${LIVEKIT_WSS_URL}" \
            --dart-define=LIVEKIT_TOKEN_SERVER_URL="${LIVEKIT_TOKEN_SERVER_URL}" \
            --dart-define=FIREBASE_PROJECT_ID="${FIREBASE_PROJECT_ID}" \
            --dart-define=APP_BASE_URL="${APP_BASE_URL}"

      # ──────────────────────────────────────────────────────────────────
      # 6. Build AAB
      # ──────────────────────────────────────────────────────────────────
      - name: Build AAB
        script: |
          set -e

          flutter build appbundle --release \
            --build-name=2.38.1 \
            --build-number=4 \
            --dart-define=LIVEKIT_WSS_URL="${LIVEKIT_WSS_URL}" \
            --dart-define=LIVEKIT_TOKEN_SERVER_URL="${LIVEKIT_TOKEN_SERVER_URL}" \
            --dart-define=FIREBASE_PROJECT_ID="${FIREBASE_PROJECT_ID}" \
            --dart-define=APP_BASE_URL="${APP_BASE_URL}"

      # ──────────────────────────────────────────────────────────────────
      # 7. Copie des artefacts
      # ──────────────────────────────────────────────────────────────────
      - name: Copy artifacts
        script: |
          set -e

          mkdir -p build/outputs

          cp build/app/outputs/flutter-apk/app-release.apk \
             build/outputs/crux-release.apk

          cp build/app/outputs/bundle/release/app-release.aab \
             build/outputs/crux-release.aab

    artifacts:
      - build/outputs/crux-release.apk
      - build/outputs/crux-release.aab

    publishing:
      email:
        recipients:
          - kouakouchristevann@gmail.com

        notify:
          success: true
          failure: true
